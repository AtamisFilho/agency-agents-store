name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shell syntax (bash -n)
        run: |
          bash -n instaladores/instalar-linux.sh
          bash -n instaladores/instalar.sh
          bash -n tests/run-tests.sh

      - name: PowerShell syntax (Parser)
        shell: pwsh
        run: |
          foreach ($f in @("instaladores/instalar-windows.ps1", "instaladores/instalar.ps1")) {
            $errs = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f), [ref]$null, [ref]$errs)
            if ($errs.Count) { $errs | ForEach-Object { Write-Error $_.Message }; exit 1 }
            Write-Host "OK $f"
          }

      - name: Python syntax (py_compile)
        run: python3 -m py_compile gerador/build.py instaladores/agency-install.py tests/test_guide.py

      - name: JSON data files are valid
        run: python3 -c "import json,glob; [json.load(open(f, encoding='utf-8')) for f in glob.glob('dados/**/*.json', recursive=True)]; print('JSON ok')"

      - name: Guide tests (static — payload, i18n parity, XSS)
        run: python3 tests/test_guide.py

      - name: Guide is up to date with dados/
        run: |
          python3 gerador/build.py
          if ! git diff --exit-code -- guia-especialistas-agencia.html manifest.webmanifest sw.js index.html; then
            echo "::error::artefatos do guia/PWA desatualizados — rode 'python3 gerador/build.py' e commite"
            exit 1
          fi

      - name: PWA icons are deterministic (regenerate → no diff)
        run: |
          python3 gerador/gen_icons.py
          if ! git diff --exit-code -- pwa-icons; then
            echo "::error::pwa-icons divergiu da regeneração — commite os ícones novos"
            exit 1
          fi

      - name: PWA release package builds
        run: |
          python3 gerador/package_pwa.py
          python3 - <<'EOF'
          import glob, zipfile
          zips = glob.glob("agency-agents-pwa-*.zip")
          assert len(zips) == 1, zips
          with zipfile.ZipFile(zips[0]) as z:
              names = z.namelist()
          for need in ("index.html", "manifest.webmanifest", "sw.js", "COMO-HOSPEDAR.md",
                       "pwa-icons/icon-192.png", "pwa-icons/icon-maskable-512.png"):
              assert need in names, f"falta {need} no zip"
          print("zip OK:", zips[0], "->", len(names), "arquivos")
          EOF

      - name: Installer suite (adversarial — uses network to clone the catalog)
        run: bash tests/run-tests.sh

  old-python:
    # o driver declara suporte a Python 3.8+ (`from __future__ import annotations`);
    # este job garante que uma PEP 604 acidental volte a quebrar versões antigas
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python-version: ["3.8", "3.9"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: py_compile + smoke (import, --status --json, --list)
        env:
          HOME: /tmp/smoke-home
        run: |
          python3 -m py_compile instaladores/agency-install.py gerador/build.py
          mkdir -p /tmp/smoke-home
          bash instaladores/instalar-linux.sh --lang en --status --json </dev/null | python3 -c '
          import json, sys
          d = json.load(sys.stdin)
          assert d["lang"] == "en" and len(d["tools"]) >= 13'
          bash instaladores/instalar-linux.sh --list </dev/null | python3 -c '
          import json, sys
          d = json.load(sys.stdin)
          assert d["catalog"] is None and len(d["tools"]) >= 13'

  windows:
    # o PS1 nunca era EXECUTADO em lugar nenhum (só Parser) — é onde os bugs do
    # PS 5.1 vivem. Smoke real no powershell.exe 5.1 do runner.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax (PowerShell parser)
        shell: pwsh
        run: |
          foreach ($f in @("instaladores/instalar-windows.ps1", "instaladores/instalar.ps1")) {
            $errs = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f), [ref]$null, [ref]$errs)
            if ($errs.Count) { $errs | ForEach-Object { Write-Error $_.Message }; exit 1 }
            Write-Host "OK $f"
          }
      - name: Smoke — List e Status -Json (Windows PowerShell 5.1, escreve nada)
        shell: powershell
        run: |
          $out = powershell -NoProfile -ExecutionPolicy Bypass -File instaladores\instalar-windows.ps1 -Status -Json
          $d = $out | ConvertFrom-Json
          if (-not $d.tools -or $d.tools.Count -lt 13) { Write-Error "tools insuficientes"; exit 1 }
          if (Test-Path "$PWD\guia-status.js") { Write-Error "escreveu guia-status.js em modo -Json"; exit 1 }
          $out2 = powershell -NoProfile -ExecutionPolicy Bypass -File instaladores\instalar-windows.ps1 -List
          $l = $out2 | ConvertFrom-Json
          if (-not $l.tools -or $l.tools.Count -lt 13) { Write-Error "-List tools insuficientes"; exit 1 }
      - name: Smoke — instalação real com -Plan (catálogo de verdade)
        shell: powershell
        run: |
          $plan = "$env:RUNNER_TEMP\smoke-plan.json"
          Set-Content $plan -Encoding UTF8 -Value '{"ferramentas":["zcode"],"agentes":[{"slug":"code-reviewer","file":"engineering/engineering-code-reviewer.md"},{"slug":"reality-checker","file":"testing/testing-reality-checker.md"}]}'
          powershell -NoProfile -ExecutionPolicy Bypass -File instaladores\instalar-windows.ps1 -Lang en -Plan $plan
          if (-not (Test-Path "$env:USERPROFILE\.zcode\agents\code-reviewer.md")) { Write-Error "agent not installed"; exit 1 }
          if (-not (Test-Path "$env:USERPROFILE\.agency-agents\config")) { Write-Error "lang config missing after fresh install"; exit 1 }
          Write-Host "Windows install OK"

      - name: Smoke — rejected branches (PS 5.1 executa de verdade)
        shell: powershell
        run: |
          $o1 = powershell -NoProfile -ExecutionPolicy Bypass -File instaladores\instalar-windows.ps1 -Tool foo -Squad pre 2>&1
          if ($LASTEXITCODE -eq 0) { Write-Error "-Tool foo should be rejected"; exit 1 }
          if (-not ("$o1" -match "Unknown tool")) { Write-Error "missing tool_unknown message"; exit 1 }
          $o2 = powershell -NoProfile -ExecutionPolicy Bypass -File instaladores\instalar-windows.ps1 -Tool zcode -Squad nope 2>&1
          if ($LASTEXITCODE -eq 0) { Write-Error "-Squad nope should be rejected"; exit 1 }
          if (-not ("$o2" -match "Invalid squad")) { Write-Error "missing err_squad message"; exit 1 }
          $o3 = powershell -NoProfile -ExecutionPolicy Bypass -File instaladores\instalar-windows.ps1 -Tool zcode -Squad pre -Dir "C:\__definitely_missing_dir__" 2>&1
          if ($LASTEXITCODE -eq 0) { Write-Error "-Dir missing should be rejected"; exit 1 }
          Write-Host "PS1 rejected branches OK"
          exit 0   # runner propaga $LASTEXITCODE residual (o -Dir acima morreu com 1 de propósito)

      - name: Smoke — DryRun previews and writes nothing (PS 5.1)
        shell: powershell
        run: |
          # ferramenta que o smoke de instalação real NÃO tocou (lá foi zcode):
          # se o dry-run escrever, .gemini aparece e o assert pega
          $o = powershell -NoProfile -ExecutionPolicy Bypass -File instaladores\instalar-windows.ps1 -DryRun -Tool geminiCli -Squad pre 2>&1
          if ($LASTEXITCODE -ne 0) { Write-Error "dry-run failed: $o"; exit 1 }
          if (Test-Path "$env:USERPROFILE\.gemini\agents") { Write-Error "dry-run wrote .gemini\agents"; exit 1 }
          Write-Host "PS1 dry-run OK"
          exit 0

      - name: Smoke — .cmd launcher (double-click path, args skip pause)
        shell: cmd
        run: instaladores\instalar-windows.cmd -List
