o", "Necesito orquestar equipos creativos y presupuesto del portafolio", "Visión creativa y meta financiera chocan en mis proyectos, revisa", "¿Cancelo un juego o realoco al equipo para salvar el trimestre?"]}, "senior-project-manager": {"d": "Convierte specs en tareas y recuerda proyectos anteriores; se enfoca en alcance realista, sin procesos en segundo plano y requisitos exactos del spec", "x": ["Recibí un spec de 20 páginas y necesito convertirlo en tareas reales", "Necesito partir mi alcance en tareas sin olvidar nada", "Mi plan tiene tareas paralelas que dependen entre sí, revisa", "¿Añado una feature fuera del spec o mantengo el alcance cerrado?"]}, "research-synthesist": {"d": "Experto en revisión de literatura, evaluación de fuentes y síntesis de evidencia; convierte fuentes dispersas en un mapa estructurado y ponderado honestamente de lo que la evidencia realmente respalda", "x": ["Leí 30 artículos de mi mercado y quedó una sopa de notas", "Necesito una revisión estructurada de las fuentes antes de decidir", "Mi síntesis trata opinión fuerte como hecho, revisa el peso de las fuentes", "¿Uso pocos estudios fuertes o armo un panorama amplio y superficial?"]}, "account-strategist": {"d": "Estratega de cuentas post-venta: ejecución land-and-expand, mapeo de stakeholders, facilitación de QBR y retención de ingresos netos; convierte deals cerrados en relaciones de plataforma de largo plazo", "x": ["Cierro contratos pequeños que nunca crecen después", "Necesito un plan de expansión para los clientes que ya pago", "Mi cuenta clave tiene un solo contacto y renueva lento, revisa", "¿Presiono la renovación ahora o abro upsell con un nuevo equipo?"]}, "sales-coach": {"d": "Coach de ventas experto: desarrollo de vendedores, revisión de pipeline, coaching de llamadas, estrategia de deals y precisión de forecast; mejora cada rep y cada deal con metodología estructurada y feedback", "x": ["Mi vendedor da 20% de descuento en toda negociación sin intentar valor", "Necesito un método de coaching para mi equipo de 3 vendedores", "En las calls grabadas hablo demasiado y escucho poco, revisa conmigo", "¿Foco el coaching en pipeline nuevo o en los deals trabados?"]}, "deal-strategist": {"d": "Estratega senior de deals: cualificación MEDDPICC, posicionamiento competitivo y plan de victoria en ciclos B2B complejos; puntúa oportunidades, expone riesgos del pipeline y arma estrategias que sobreviven al forecast", "x": ["Mi deal grande se trabó hace 3 semanas sin respuesta del comprador", "Necesito calificar la oportunidad B2B antes de gastar semanas", "Mi deal tiene un campeón débil y un decisor invisible, revisa", "¿Empujo la propuesta ahora o mejoro la cualificación primero?"]}, "discovery-coach": {"d": "Entrena equipos de ventas en metodología de discovery de élite: diseño de preguntas, mapeo del estado actual, cuantificación de brechas y estructura de llamada que revela la motivación real de compra", "x": ["Mis calls de discovery se vuelven demo y el cliente desaparece", "Necesito un guion de preguntas que revele el dolor real", "En la call descubrí el dolor al revés y perdí el deal, revisa", "¿Priorizo mapear el budget o cuantificar el dolor en discovery?"]}, "sales-engineer": {"d": "Ingeniero pre-venta senior: discovery técnico, ingeniería de demos, scoping de POC y battlecards competitivas; conecta capacidades del producto con resultados de negocio y gana la decisión técnica para cerrar el deal", "x": ["Un cliente técnico mató mi pitch pidiendo detalles que no sabía", "Necesito una demo que muestre valor real, no solo pantallas bonitas", "Corrí un POC de 3 semanas y el cliente no validó nada, revisa", "¿Hago un POC completo o una demo guiada que cierra más rápido?"]}, "offer-lead-gen-strategist": {"d": "Arquitecto de top-of-funnel: diseña ofertas irresistibles y lead magnets que atraen compradores calificados a escala; construcción por ecuación de valor, generación multicanal y alcance compuesto", "x": ["Mi sitio genera 10 leads/mes, todos sin dinero para comprar", "Necesito un lead magnet que atraiga al cliente correcto", "Mi oferta no atrae a nadie a pesar del precio justo, revisa", "¿Cambio mi oferta o solo cambio el canal de captación?"]}, "outbound-strategist": {"d": "Especialista en outbound basado en señales: diseña secuencias de prospección multicanal, define ICPs y construye pipeline con personalización guiada por investigación, no por volumen", "x": ["Mando 500 emails fríos por semana y recibo 2 respuestas", "Necesito una secuencia de prospección basada en señales", "Mi secuencia usa el mismo mensaje para todos, revisa", "¿Aumento el volumen de emails o mejoro la personalización?"]}, "pipeline-analyst": {"d": "Analista de revenue operations: diagnóstico de salud del pipeline, velocidad de deals, precisión de forecast y coaching con datos; convierte el CRM en inteligencia que revela riesgos antes de perder el trimestre", "x": ["Mi pipeline parece lleno pero el mes cierra bajo la meta", "Necesito un diagnóstico de mi embudo de ventas en el CRM", "Mi forecast tiene deals 'casi cerrando' que nunca cierran, revisa", "¿Foco en acelerar deals viejos o llenar la parte alta del embudo?"]}, "proposal-strategist": {"d": "Arquitecto estratégico de propuestas: convierte RFPs y oportunidades de venta en narrativas ganadoras, con posicionamiento competitivo y resúmenes ejecutivos persuasivos, no solo formales.", "x": ["Hice una propuesta para el cliente pero se ve débil, ¿cómo la hago más persuasiva?", "Recibí un RFP de licitación, debo responder punto por punto y además convencer", "Mis propuestas siempre pierden contra el competidor, ¿dónde falla mi posicionamiento?", "Necesito un resumen ejecutivo que haga decidir al director en 2 minutos"]}, "ai-generated-code-security-auditor": {"d": "Revisor de seguridad para apps hechas con IA: busca secretos hardcodeados, RLS rota y puntos de prompt injection, y guía ciclos de escanear, corregir y reescanear con hallazgos mapeados a CWE.", "x": ["Claude generó toda mi app, ¿habrá dejado contraseñas o claves expuestas en el código?", "Tengo una app hecha con IA con login, ¿puede cualquier usuario ver datos ajenos?", "Mi chatbot lee textos de usuarios, ¿hay riesgo de prompt injection para robar datos?", "Publiqué con IA sin revisar seguridad, quiero un escaneo honesto antes de divulgar"]}, "application-security-engineer": {"d": "Especialista AppSec que asegura el ciclo de desarrollo con modelado de amenazas, revisión de código seguro, integración de SAST/DAST y formación para que el código seguro sea lo normal.", "x": ["Voy a lanzar una app con registro de usuarios, ¿cómo reviso el código con seguridad?", "Necesito pruebas automáticas que avisen cuando un commit abra una brecha", "Mi API pública creció, ¿cómo mapear dónde puede ser atacada?", "Equipo pequeño sin experiencia en seguridad, ¿cómo volver seguro el código por defecto?"]}, "security-architect": {"d": "Arquitecto de seguridad experto: modelado de amenazas, diseño seguro por defecto, límites de confianza y defensa en profundidad en web, APIs y cloud. Diseña el modelo; el SAST/DAST y SDLC van al AppSec.", "x": ["Voy a unir app, pagos y datos de clientes, ¿cómo diseñarlo seguro desde el inicio?", "Mi sistema tiene API, web y móvil, ¿dónde quedan los límites de confianza?", "Recibí la app lista de un freelancer, ¿cómo evalúo la arquitectura de seguridad?", "¿Vale pagar seguridad ahora o solo tras el primer usuario que pague?"]}, "blockchain-security-auditor": {"d": "Auditor experto de seguridad de smart contracts: detección de vulnerabilidades, verificación formal, análisis de exploits e informes completos de auditoría para protocolos DeFi y apps blockchain.", "x": ["Mi smart contract de sorteo en cripto recibirá dinero, necesita auditoría", "Copié un contrato DeFi de un tutorial, ¿tiene exploits ocultos?", "El contrato pasó las pruebas pero quiero segunda opinión antes de publicarlo en mainnet", "El informe de auditoría señaló 3 fallos, ¿cómo priorizar las correcciones?"]}, "cloud-security-architect": {"d": "Especialista en seguridad cloud: diseña arquitecturas zero trust, aplica defensa en profundidad en AWS, Azure y GCP y asegura los pipelines de infraestructura como código desde el día uno.", "x": ["Subí mi app a AWS con base de datos y storage, ¿cómo blindarla bien?", "Quiero el mínimo de permisos para que mi app acceda a la base, ¿cómo configurarlo?", "Mi Terraform crea la infraestructura solo, ¿cómo evitar que algo quede abierto?", "¿AWS, Azure o Vercel para una app con datos de salud? Seguridad ante todo"]}, "compliance-auditor": {"d": "Auditor técnico experto en cumplimiento: auditorías SOC 2, ISO 27001, HIPAA y PCI-DSS, desde la evaluación inicial y recolección de evidencias hasta la certificación.", "x": ["Voy a procesar datos de pacientes en mi app, debo prepararme para la auditoría", "Un cliente grande pidió SOC 2 para cerrar el contrato, ¿por dónde empiezo?", "Tengo evidencias regadas en carpetas, ¿cómo organizarlas para la certificación?", "Necesito PCI-DSS para aceptar tarjetas en mi e-commerce, ¿cuánto cuesta?"]}, "incident-responder": {"d": "Especialista en forense digital y respuesta a incidentes: investiga brechas, contiene amenazas activas, coordina la crisis y escribe post-mortems que evitan que se repita.", "x": ["Mi sitio fue invadido y muestra anuncios de casino, ¿qué hago ahora?", "Sospecho que se filtraron contraseñas de mi app, ¿cómo investigar sin destruir pruebas?", "Servidor comprometido a las 3 de la mañana, ¿cómo contener el daño rápido?", "Tras el ataque, quiero un informe de lo ocurrido para no repetirlo"]}, "penetration-tester": {"d": "Especialista en seguridad ofensiva: pentests autorizados, red team y análisis de vulnerabilidades en redes, aplicaciones web e infraestructura cloud.", "x": ["Mi app pasó las pruebas funcionales, pero quiero un pentest de verdad", "Antes de lanzar mi SaaS, quiero saber si se puede vulnerar el login", "Recibí un aviso de bug bounty, quiero validar si es explotable de verdad", "El red team encontró un camino a mi panel admin, ¿cómo interpreto el hallazgo?"]}, "secrets-credential-hygiene-engineer": {"d": "Gestiona el ciclo completo de secretos y credenciales: detección, prevención, bóveda, rotación y respuesta a fugas, para que tu app use credenciales de corta vida, con privilegios mínimos y nunca en el código.", "x": ["Puse la clave de la API de Stripe directo en el código, ¿y ahora?", "Encontré mi token en GitHub en un commit antiguo, ¿cómo rotar todo con seguridad?", "Hay varios .env en el proyecto, ¿cómo centralizar secretos sin romper la app?", "Quiero una regla que bloquee commits con contraseñas antes de subir al repo"]}, "senior-secops-engineer": {"d": "Especialista defensivo: escanea cada entrega de código buscando secretos y datos sensibles, y aplica controles según el estándar: auth, tokens, cookies, cabeceras, CORS, rate limit, CSP y validación de entradas.", "x": ["Mi app tiene login propio, quiero revisar cookies, tokens y rate limit", "El registro acepta cualquier cosa, ¿cómo validar las entradas bien?", "Necesito un estándar de seguridad escrito para mi equipo de vibe coders", "Quiero bloquear secretos en el repo automáticamente antes del merge"]}, "threat-detection-engineer": {"d": "Ingeniero de detección experto: reglas SIEM, mapeo de cobertura MITRE ATT&CK, threat hunting, ajuste de alertas y pipelines de detección como código para equipos de seguridad.", "x": ["Mi SaaS creció y nadie notaría a un intruso, ¿cómo crear alertas?", "Quiero reglas en el SIEM para detectar intentos masivos de login en mi app", "Demasiadas alertas y nada útiles, ¿cómo afinar para que suene solo lo real?", "¿Cómo mapear qué ataques detecta hoy mi app y dónde estoy ciego?"]}, "threat-intelligence-analyst": {"d": "Analista de inteligencia de ciberamenazas: rastrea grupos adversarios, mapea campañas a MITRE ATT&CK, produce informes accionables y crea reglas de detección que atrapan amenazas reales.", "x": ["Mi dominio es blanco de phishing, ¿cómo saber quién está detrás?", "Quiero saber si apps como el mío están siendo atacados ahora", "Un informe de intel dijo que mi proveedor fue comprometido, ¿y ahora?", "Necesito reglas de detección basadas en lo que hacen los grupos criminales hoy"]}, "macos-spatial-metal-engineer": {"d": "Especialista en Swift y Metal nativo: construye sistemas de renderizado 3D de alto rendimiento y experiencias de computación espacial para macOS y Vision Pro.", "x": ["Mi app Mac de visualización 3D se traba con modelos grandes, ¿cómo acelerarla?", "Quiero renderizar a 60fps con Metal en mi app de diseño para Mac", "Mi código Metal corre en mi Mac pero falla en la máquina del cliente", "¿Metal o SceneKit para mi visualizador de planos 3D en macOS?"]}, "terminal-integration-specialist": {"d": "Emulación de terminal, optimización de renderizado de texto e integración de SwiftTerm en apps Swift modernas.", "x": ["Quiero un terminal dentro de mi app Mac que ejecute comandos de verdad", "El texto de mi terminal en Swift aparece desordenado y lento", "Integré SwiftTerm pero colores y emojis se rompen, ¿cómo revisar?", "¿Terminal hecho a mano o librería lista para mi editor en Swift?"]}, "visionos-spatial-engineer": {"d": "Computación espacial nativa en visionOS, interfaces volumétricas con SwiftUI e implementación del diseño Liquid Glass.", "x": ["Sueño con ver mis muebles 3D flotando en la sala con Vision Pro, ¿cómo empezar?", "Mi ventana de visionOS desaparece cuando el usuario camina, ¿cómo fijarla?", "Mi app de Vision Pro fue rechazada por romper las directrices de Liquid Glass", "¿Vale hacer versión Vision Pro de mi app de planos o es nicho muy pequeño?"]}, "xr-cockpit-interaction-specialist": {"d": "Especialista en diseñar y desarrollar sistemas de control inmersivos tipo cabina para entornos XR.", "x": ["Quiero un panel de control 3D en el visor para mi app de gestión de flota", "Mis botones en VR son difíciles de pulsar con el mando, ¿cómo mejorar?", "Revisé mi UI de cabina y el piloto se pierde entre menús, ¿cómo simplificar?", "¿Mirada, mando o gesto para la acción principal en mi cabina de dron?"]}, "xr-immersive-developer": {"d": "Desarrollador experto en WebXR y tecnologías inmersivas, especializado en apps de AR/VR/XR que corren en el navegador.", "x": ["Quiero que mi sitio tenga un tour en VR directo en el navegador, sin app", "Mi WebXR abre en PC pero no entra en VR en los lentes del visitante", "Probé mi escena WebXR y da mareo tras 2 minutos, ¿cómo revisarla?", "¿WebXR o app nativo para el tour 360 de mi inmueble?"]}, "xr-interface-architect": {"d": "Diseñador de interacción espacial y estratega de interfaces para entornos inmersivos AR/VR/XR.", "x": ["Quiero una app AR que muestre info al apuntar a la máquina de la fábrica", "Los usuarios no hallan el menú en mi app VR, ¿cómo organizar la interfaz espacial?", "Revisé el flujo de mi app AR y el usuario teclea demasiado, ¿cómo repensarlo?", "¿Interfaz anclada al mundo o a la mirada para mi tutorial en AR?"]}, "accounts-payable-agent": {"d": "Especialista autónomo en pagos: ejecuta pagos a proveedores, facturas de freelancers y cuentas recurrentes en cualquier vía —cripto, fiat, stablecoins—. Se integra con agentes de IA vía tool calls.", "x": ["Quiero automatizar el pago de 20 freelancers cada día 5", "Mi agente pagó una factura duplicada, ¿cómo revisar las reglas antes de correr?", "Debo pagar a un proveedor en USDC y a otro con boleto, ¿se puede unificar?", "¿Integrar mi app directo al banco o pasar por API de pagos?"]}, "agentic-identity-trust-architect": {"d": "Diseña sistemas de identidad, autenticación y verificación de confianza para agentes de IA autónomos en entornos multiagente: cada agente puede probar quién es, qué puede hacer y qué hizo.", "x": ["Mis 3 agentes de IA se comunican entre sí, ¿cómo prueba cada uno quién es?", "Un agente ejecutó una acción que no debía, ¿cómo limitar por identidad?", "Revisé el log de mis agentes y no se sabe quién hizo qué", "¿Debo dar clave única por agente o una sola para el sistema?"]}, "agents-orchestrator": {"d": "Gestor autónomo de pipelines que orquesta todo el flujo de desarrollo. Es el líder de este proceso.", "x": ["Quiero que un agente escriba, otro revise y otro pruebe, ¿cómo orquestarlo?", "Mis agentes se traban esperándose entre sí, ¿cómo diseñar el pipeline?", "Corrí 4 agentes en la misma tarea y el resultado quedó caos, ¿lo revisas?", "¿Vale automatizar todo mi flujo de dev o mantener manual lo crítico?"]}, "automation-governance-architect": {"d": "Arquitecto gobernanza-first para automatizaciones de negocio (n8n primero): audita valor, riesgo y mantenibilidad antes de implementar.", "x": ["Creé 12 automatizaciones en n8n y ya no sé qué hace cada una, ¿ayuda?", "Quiero automatizar cobros a clientes pero antes medir si vale el riesgo", "La automatización mandó la promo a la lista de morosos, ¿la revisas?", "¿Construir automatización propia o suscribir un SaaS listo para mi proceso?"]}, "business-strategist": {"d": "Consultor senior de estrategia: análisis competitivo, entrada a mercados, diseño de modelo de negocio y plan de crecimiento; traduce dinámicas complejas en estrategias claras y accionables.", "x": ["Mi app tiene 500 usuarios pero nadie paga, ¿cómo hallar un modelo viable?", "Quiero entrar al mercado de apps para clínicas, ¿por dónde atacar primero?", "Un competidor copió mi app y es más barato, ¿cómo reposicionar?", "¿Cobrar suscripción o licencia única para mi software de agenda?"]}, "change-management-consultant": {"d": "Especialista en gestión del cambio (ADKAR, Kotter, Prosci): guía implementaciones, reestructuras y fusiones gestionando resistencia y logrando que el cambio se sostenga tras el lanzamiento.", "x": ["Cambiaré el sistema del equipo y la mitad ya protesta, ¿cómo conducirlo?", "Mi equipo ignora la app nueva que implementé, ¿cómo lograr adopción real?", "Antes de anunciar el cambio, quiero revisar el plan de comunicación interna", "¿Cambiar de una ve eada, código muerto y docs que mienten.", "x": ["Usé Cursor, Claude y Copilot en el mismo proyecto y la app rompe lógica a cada rato", "Quiero auditar mi código para hallar funciones muertas y docs que mienten", "Revisé mi historial de commits y hay trozos que dos IAs escribieron distinto", "¿Rehacer el módulo enredado o remendar otra vez?"]}, "cultural-intelligence-strategist": {"d": "Especialista en CQ: detecta exclusión invisible, investiga contexto global y garantiza que el software resuene auténticamente en identidades diversas.", "x": ["Mi app se expandió a otros países y el humor de las pantallas no cuadra allá", "Quiero revisar mi app para que todos los públicos se sientan representados", "Revisé mis pantallas de registro y el campo de género es muy restrictivo", "¿Traducir mi app o adaptarla culturalmente para cada mercado nuevo?"]}, "developer-advocate": {"d": "Developer advocate experto: construye comunidades de devs, crea contenido técnico atractivo, optimiza la experiencia de desarrollador (DX) e impulsa la adopción de plataformas con engagement auténtico.", "x": ["Lancé mi API y nadie la usa, quiero contenido que haga probar a los devs", "Quiero un tutorial y demo que muestre el valor de mi SaaS en 5 min", "Revisé mi documentación y los devs abandonan en el primer ejemplo", "¿Invertir en comunidad en Discord o en posts técnicos del blog?"]}, "document-generator": {"d": "Experto en generación de documentos: crea PDF, PPTX, DOCX y XLSX profesionales por código, con formato correcto, gráficos y visualización de datos.", "x": ["Necesito generar 200 contratos en PDF personalizados desde una hoja", "Quiero una presentación PPTX automática con los números del mes", "Revisé mis reportes generados y la tabla corta de página, ajusta el layout", "¿Generar DOCX editable o PDF fijo para el contrato del cliente?"]}, "fedramp-rmf-compliance-engineer": {"d": "Ingeniero de cumplimiento FedRAMP y RMF: dominio de la vía tradicional Rev5 (NIST 800-53, SSP, 3PAO) y del FedRAMP 20x, más ATO, ConMon, POA&M, FIPS 199 y paquetes OSCAL.", "x": ["Quiero vender mi SaaS al gobierno de EE.UU., ¿qué exige el FedRAMP?", "Necesito armar el SSP y saber qué camino de autorización elegir", "Revisé mi POA&M y hay 12 ítems abiertos, ¿cómo priorizar para el auditor?", "¿FedRAMP tradicional o el nuevo 20x para mi producto?"]}, "focus-music-architect": {"d": "Especialista en música instrumental de foco e ingeniero de prompts neuroacústicos: diseña prompts de alto rendimiento, arquitecturas sonoras, curvas de BPM y capas binaurales para flujo profundo.", "x": ["Quiero una playlist instrumental propia para programar 2h concentrado", "Necesito un prompt certero para generar música de foco sin voces con IA", "Probé mis pistas y me distraje a la mitad, revisa el tiempo (BPM)", "¿Sonidos binaurales o lo-fi clásico para mi rutina de estudio?"]}, "french-consulting-market-navigator": {"d": "Navega el ecosistema freelance francés (ESN/SI): modelos de margen, plataformas (Malt, collective.work), portage salarial, posicionamiento de tarifas y ciclos de pago reales.", "x": ["Quiero vivir en Francia y trabajar como dev freelance, ¿cómo funciona Malt?", "Necesito entender margen y portage salarial antes de aceptar oferta", "Revisé mi TJM y estoy por debajo del mercado francés para mi nivel", "¿Freelance directo o pasar por una ESN para mi primer contrato allá?"]}, "korean-business-navigator": {"d": "Cultura de negocios coreana para extranjeros: proceso de decisión 품의, lectura del nunchi, etiqueta de KakaoTalk, jerarquía y tratos basados en relaciones.", "x": ["Me reuniré con un cliente coreano y no sé cómo dirigirme a su CEO", "Necesito entender cómo pasa la decisión por la jerarquía antes de proponer", "Revisé mi email al socio de Seúl y soné demasiado agresivo", "¿Negociar por KakaoTalk o pedir reunión formal?"]}, "master-plan-architect": {"d": "Arquitecto de planificación maestra, educador técnico y crítico implacable: enseña arquitectura en profundidad, hace red teaming de riesgos y crea planes de implementación en Markdown sin ejecutar código.", "x": ["Tengo una idea de app grande y quiero un plan de implementación sin código", "Mi plan de 6 meses se ve bonito, quiero que alguien destroce los riesgos", "Revisé mi roadmap y faltan las dependencias entre fases", "¿Construir todo de una vez o un MVP en 6 semanas?"]}, "mcp-builder": {"d": "Desarrollador experto en Model Context Protocol: diseña, construye y prueba servidores MCP que amplían agentes de IA con tools, recursos y prompts personalizados.", "x": ["Quiero que mi agente acceda a mi base de datos, oí hablar de MCP", "Necesito construir un servidor MCP que exponga mis reportes a Claude", "Probé mi MCP server y la tool falla al pasar un archivo grande", "¿Crear una tool custom o usar API directa en mi agente?"]}, "model-qa-specialist": {"d": "Experto independiente en QA de modelos: audita modelos ML y estadísticos de punta a punta —revisión de documentación, reconstrucción de datos, replicación, calibración, interpretabilidad y monitoreo—.", "x": ["Mi modelo de predicción de ventas parece bueno en test y malo en la práctica", "Quiero una auditoría independiente del modelo antes de usarlo con clientes", "Revisé mi modelo y no sé si los datos de entrenamiento se filtraron al test", "¿Reentrenar con más datos o cambiar de algoritmo?"]}, "pricing-analyst": {"d": "Analista de precios especializado: desarrolla modelos óptimos con investigación de mercado, análisis de competidores, costos y márgenes; convierte precios en ventaja basada en datos.", "x": ["Cobré 49 en mi app y nadie compra, ¿19 sería mejor?", "Quiero armar una tabla de planes con investigación de competidores", "Revisé mis precios y el costo por usuario se come el lucro del plan básico", "¿Cobrar por usuario o por uso en mi SaaS?"]}, "salesforce-architect": {"d": "Arquitectura de soluciones Salesforce: diseño multi-cloud, patrones de integración, governor limits, estrategia de despliegue y gobernanza del modelo de datos en orgs grandes.", "x": ["Mi empresa migró a Salesforce y nada se conecta, quiero diseñarlo bien", "Necesito modelo de datos e integración entre Sales y Service Cloud", "Revisé mi org y chocamos con el governor limit en cada script", "¿Instalar un app del AppExchange o desarrollar custom?"]}, "strategy-duel-agent": {"d": "Conduce duelos de estrategia en vivo usando teoría de juegos y las 36 estratagemas chinas.", "x": ["Un competidor me copia y corta precios cada mes, estoy sin respuesta", "Quiero simular un duelo estratégico antes de lanzar mi producto nuevo", "Revisé mi plan de ataque al rival y no consideré su reacción", "¿Responder al competidor de frente o maniobrar por fuera?"]}, "workflow-architect": {"d": "Especialista en workflows: mapea árboles completos por sistema, journey e interacción de agente —camino feliz, ramas, fallos, recuperación, entregas y estados— para specs listas para construir y probar.", "x": ["Quiero dibujar el flujo completo de mi app de citas antes de programar", "Mi app se traba cuando el pago falla, necesito mapear caminos de error", "Revisé mi flujo de registro y hay 4 estados que nadie especificó", "¿Un solo flujo para todo o flujos separados por tipo de usuario?"]}, "study-abroad-advisor": {"d": "Experto integral en estudios en el extranjero (EE.UU., UK, Canadá, Australia, Europa, Hong Kong, Singapur): estrategia de admisión, selección de escuelas, ensayos, exámenes, visas y adaptación.", "x": ["Mi hija quiere hacer una maestría en Canadá, ¿por dónde empezar?", "Quiero un plan de 12 meses con exámenes, essays y becas organizados", "Revisé su essay y suena a lista de logros, no a historia personal", "¿Invertir en curso preparatorio o tutor individual para el examen?"]}, "supply-chain-strategist": {"d": "Experto en cadena de suministro y compras: desarrollo de proveedores, sourcing estratégico, control de calidad y digitalización; construye cadenas eficientes y resilientes desde el ecosistema chino.", "x": ["Voy a importar componentes para mi gadget y no sé elegir proveedor", "Necesito un plan de sourcing con 2 proveedores para no depender de 1", "Revisé mis lead times y la producción atrasa cada pedido de China", "¿Producir en China o buscar un proveedor más cerca?"]}, "zk-steward": {"d": "Custodio de base de conocimientos al estilo del Zettelkasten de Luhmann: notas atómicas, conectividad y bucles de validación; cambia a expertos (Feynman, Munger) según la tarea.", "x": ["Tengo 300 notas regadas y nada se conecta, quiero una base de conocimiento", "Necesito partir mi proyecto gigante en notas atómicas enlazadas", "Revisé mi Zettelkasten y hay notas duplicadas sin ningún link", "¿Notas por proyecto o por concepto en mi base?"]}, "analytics-reporter": {"d": "Analista de datos experto: convierte datos crudos en insights accionables; crea dashboards, hace análisis estadístico, sigue KPIs y apoya decisiones con visualización e informes.", "x": ["Tengo una hoja de ventas con 10 mil filas y quiero ver los patrones dentro", "Necesito un dashboard que muestre los KPIs de mi app casi en tiempo real", "Revisé mi reporte mensal y nadie entiende los gráficos que hice", "¿Métrica de usuarios activos o de ingresos como norte de mi panel?"]}, "executive-summary-generator": {"d": "Especialista de nivel consultoría: convierte insumos complejos en resúmenes ejecutivos concisos y accionables, con marcos McKinsey SCQA, BCG y Bain, para decisiones de C-level.", "x": ["Escribí un análisis de 20 páginas y el inversionista quiere 1, ¿cómo resumir?", "Necesito el resumen ejecutivo para que el board elija entre 2 proveedores", "Revisé mi resumen y quedó una lista de puntos sin recomendación clara", "¿Abrir con la recomendación o con el contexto en mi resumen?"]}, "finance-tracker": {"d": "Analista financiero y controller experto: planificación financiera, gestión de presupuesto y análisis de desempeño; cuida la salud financiera y optimiza el flujo de caja.", "x": ["El dinero de la app se mezcla con el personal, quiero separar y planificar", "Necesito presupuesto mensual con proyección de caja para 6 meses", "Revisé mi flujo de caja y descubro cobros atrasados tarde", "¿Guardar el excedente en caja o invertirlo en marketing?"]}, "infrastructure-maintainer": {"d": "Especialista en infraestructura: fiabilidad de sistemas, optimización de rendimiento y operaciones técnicas; mantiene infra robusta, escalable, segura y eficiente en costos.", "x": ["Mi app cae cada lunes por la mañana, quiero entender y resolver la causa", "Necesito infra que escale en el pico del Black Friday sin romperse", "Revisé mi servidor y el disco se llenó por logs acumulados", "¿Servidor dedicado propio o serverless para mi SaaS nuevo?"]}, "legal-compliance-checker": {"d": "Especialista legal y de cumplimiento: garantiza que operaciones, manejo de datos y contenidos cumplan leyes, regulaciones y estándares en varias jurisdicciones.", "x": ["Mi app va a operar en Europa, necesito saber qué leyes aplican", "Quiero revisar si mis términos de uso y política de privacidad están ok", "Revisé mi proceso de recolección de datos y falta consentimiento", "¿Abrir empresa local u operar desde fuera en el país nuevo?"]}, "support-responder": {"d": "Especialista experto en soporte: servicio excepcional, resolución de problemas y experiencia de usuario; domina soporte multicanal, cuidado proactivo e interacciones que fortalecen la marca.", "x": ["Mis usuarios abren tickets y la respuesta tarda 2 días, quiero mejorar", "Necesito atención multicanal (email, chat, WhatsApp) para la app", "Revisé mis respuestas de soporte y resuelven solo la mitad de casos", "¿FAQ pública o chatbot para reducir tickets repetidos?"]}, "accessibility-auditor": {"d": "Experto en accesibilidad: audita interfaces según WCAG, prueba con tecnologías asistivas y busca barreras por defecto — lo que no se probó con lector de pantalla no es accesible.", "x": ["Un usuario ciego se quejó de que no puede comprar en mi sitio, ¿cómo revisar?", "Quiero probar mi app con lector de pantalla antes del próximo release", "Revisé mi formulario y los errores no se anuncian al lector de pantalla", "¿Corregir ahora lo esencial o rehacer todo según WCAG?"]}, "api-tester": {"d": "Experto en pruebas de APIs: validación integral, pruebas de rendimiento y calidad en todos los sistemas e integraciones de terceros.", "x": ["Mi integración de pagos falla 1 de cada 10, ¿cómo probar mejor?", "Necesito validar mi API nueva con casos de error y límite antes del lanzamiento", "Revisé mis tests de API y solo cubren el camino feliz", "¿Postman, script propio o framework de tests para mi suite?"]}, "evidence-collector": {"d": "Especialista QA adicto a capturas y alérgico a fantasías: reporta problemas reproducibles con evidencia y marca honestamente lo no probado.", "x": ["Mi beta se rompió pero el bug desapareció, necesito capturas y pasos claros", "Quiero evidencia de cada pantalla probada antes de aprobar el release", "Revisé el informe de QA y no hay ni una captura, no se puede reproducir", "¿Aceptar 'debe estar funcionando' o exigir evidencia de cada flujo?"]}, "performance-benchmarker": {"d": "Experto en pruebas y optimización de rendimiento: mide, analiza y mejora el desempeño de todas las aplicaciones e infraestructura.", "x": ["Mi sitio tarda 5s en abrir, quiero medir y hallar el cuello de botella", "Necesito un benchmark con 500 usuarios simulados antes de la campaña", "Revisé mi app y la pantalla principal repite la misma consulta 40 veces", "¿Optimizar base de datos, cache o frontend primero?"]}, "reality-checker": {"d": "Frena aprobaciones fantásticas y certifica con evidencia: por defecto dice \"NECESITA TRABAJO\" y exige pruebas abrumadoras para pasar a producción.", "x": ["Mi agente de IA dijo que todo está listo, pero nada se probó de verdad", "Antes de lanzar, quiero a alguien escéptico que exija prueba de cada promesa", "Revisé el checklist del release y la mitad dice 'OK' sin evidencia", "¿Lanzar el viernes o esperar las pruebas reales del checkout?"]}, "test-automation-engineer": {"d": "Ingeniero experto en automatización E2E con Playwright y Cypress: selectores resilientes, elimina flakes, datos aislados, paralelización en CI y debugging guiado por trazas.", "x": ["Pruebo mi app haciendo clic a mano cada semana, quiero automatizarlo", "Necesito una suite E2E con Playwright que corra en cada commit", "Revisé mis tests E2E y 3 se rompen por selector inestable en cada build", "¿Cypress o Playwright para mi app React?"]}, "test-results-analyzer": {"d": "Experto en análisis de pruebas: evalúa resultados completos, analiza métricas de calidad y genera insights accionables de las actividades de testing.", "x": ["Mi suite corre 900 tests y fallan 60, quiero saber qué importa de verdad", "Necesito un informe de calidad de mi app con métricas que tengan sentido", "Revisé mis logs de test y hay una falla que se repite desde 3 builds atrás", "¿Corregir los 60 fallidos o filtrar lo que es inestabilidad?"]}, "tool-evaluator": {"d": "Experto en evaluación tecnológica: evalúa, prueba y recomienda tools, software y plataformas para uso empresarial y optimización de productividad.", "x": ["Necesito elegir entre 5 herramientas de CRM y estoy perdido", "Quiero comparar costos y riesgos de 3 plataformas de e-commerce", "Revisé las tools de analytics que probé y los criterios cambiaron a mitad", "¿Herramienta paga de inmediato o piloto gratis de 30 días?"]}, "workflow-optimizer": {"d": "Experto en mejora de procesos: analiza, optimiza y automatiza workflows en todas las funciones del negocio para máxima productividad y eficiencia.", "x": ["Hago la facturación a mano cada día y toma 2h, quiero recortarla", "Necesito mapear mi proceso de onboarding y hallar qué automatizar", "Revisé mi flujo de aprobación y cada pedido pasa por 5 personas", "¿Automatizar de una vez u optimizar por etapas?"]}}, "when": {"div": {"academic": "Cuando el proyecto implique mundos ficticios, investigación seria o contenido que necesita base real.", "design": "Cuando necesites mejorar la apariencia, la usabilidad o la experiencia de uso del app.", "engineering": "Cuando necesites construir, arreglar o mejorar el código y la infraestructura del proyecto.", "finance": "Cuando necesites entender números, precios, presupuesto o la salud financiera del negocio.", "game-development": "Cuando el proyecto sea un juego o tenga elementos de juego.", "gis": "Cuando el proyecto implique mapas, datos geográficos o ubicación.", "healthcare": "Cuando el proyecto esté en el área de salud y necesite seguir las normas del sector.", "marketing": "Cuando necesites atraer, enganchar o fidelizar usuarios con contenido.", "paid-media": "Cuando estés pagando anuncios y quieras mejorar el retorno de cada moneda invertida.", "product": "Cuando necesites decidir QUÉ construir y en qué orden.", "project-management": "Cuando necesites organizar tareas, plazos y el flujo de trabajo del equipo.", "research": "Cuando necesites separar hecho de opinión en investigaciones y fuentes.", "sales": "Cuando necesites vender, prospectar clientes o cuidar la cartera existente.", "security": "Antes del lanzamiento y siempre que haya datos de usuarios: es el seguro de vida del proyecto.", "spatial-computing": "Cuando el proyecto implique realidad aumentada/virtual o 3D avanzado.", "specialized": "Roles especiales para situaciones específicas: entra aquí cuando tengas un desafío fuera de lo común.", "support": "Cuando necesites cuidar al cliente después del lanzamiento u organizar la operación del día a día.", "testing": "Antes de declarar cualquier cosa 'lista': aquí vive la prueba de que funciona."}, "custom": {"code-reviewer": "Después de cualquier cambio de código importante. Di: 'usa el code-reviewer para revisar el cambio X con foco en corrección y seguridad'.", "devops-automator": "A la hora de montar el deploy, el CI/CD y publicar la plataforma (ej.: deploy en Zorin/Docker).", "reality-checker": "Antes de creer que algo está listo. Di: 'verifica con pruebas si X realmente funciona'. No acepta promesas, solo evidencia.", "api-tester": "Para probar las rutas del backend de punta a punta (login, partidas, invitaciones, rankings, pagos).", "test-automation-engineer": "Para crear la suite de tests automatizados que corre sola con cada cambio (Playwright/Cypress).", "evidence-collector": "Para convertir 'lo probé y funciona' en un informe con pruebas reproducibles, y marcar honestamente lo que no se probó.", "accessibility-auditor": "Antes del lanzamiento público: garantiza que el app sirve a todo el mundo (teclado, lectores de pantalla, contraste).", "performance-benchmarker": "Cuando el app esté lento o antes del lanzamiento, para medir y mejorar la velocidad con números.", "penetration-tester": "OBLIGATORIO antes de abrir al público: simula ataques reales para encontrar brechas antes que los delincuentes.", "application-security-engineer": "Para revisar la seguridad del código nuevo: secretos expuestos, permisos, fallas de inyección.", "threat-detection-engineer": "Después del lanzamiento: configura el monitoreo y las alertas que detectan ataques en producción.", "sprint-prioritizer": "Al inicio de cada ciclo: convierte 'todo es urgente' en un plan ordenado con un primer hito claro."}}}, "fr": {"agents": {"anthropologist": {"d": "Expert en systèmes culturels, rituels, parenté et croyances — construit des sociétés cohérentes qui semblent avoir vraiment existé, pas inventées de toutes pièces.", "x": ["Ma communauté fictive dans l'app semble sans vie, il manque des rituels et des coutumes", "Je dois créer des traditions et hiérarchies sociales crédibles pour les factions de mon jeu", "Vérifie si les coutumes que j'ai inventées sont cohérentes entre elles et sonnent réelles", "Baser ma tribu sur une culture réelle ou inventer de zéro ?"]}, "geographer": {"d": "Expert en géographie, climats et cartes — construit des mondes cohérents où relief, climat, ressources et implantations ont du sens scientifique.", "x": ["Sur ma carte, un désert touche une forêt tropicale, les joueurs trouvent ça bizarre", "Je dois placer villes, rivières et ressources de façon réaliste dans mon monde", "Vérifie si climat et relief correspondent à l'endroit où j'ai mis mes villages", "Décor principal : terrain volcanique ou plaine fertile ?"]}, "historian": {"d": "Expert en analyse historique et culture matérielle — vérifie la cohérence historique et enrichit vos décors avec des détails d'époque authentiques et sourcés.", "x": ["Mon RPG mélange armures et monnaies d'époques différentes, comment réparer ?", "Je veux des détails authentiques du quotidien dans mon village médiéval", "Vérifie si la chronologie de mon intrigue a des trous historiques", "Ambiancer au XIVe siècle ou inventer un royaume fictif ?"]}, "narratologist": {"d": "Expert en théorie du récit, structure d'histoire et arcs de personnages — appuie ses conseils sur des cadres établis, de Propp à Campbell à la narratologie moderne.", "x": ["Mon histoire se bloque au milieu, le héros perd sa motivation", "Je dois structurer les actes de ma narration interactive", "Analyse si les arcs de mes personnages se referment à la fin", "Voyage du héros classique ou structure non linéaire ?"]}, "psychologist": {"d": "Expert en comportement humain, personnalité et motivations — crée des personnages et des interactions psychologiquement crédibles, appuyés sur des cadres cliniques.", "x": ["Les utilisateurs trouvent mon méchant superficiel : il n'agit que par haine", "Je veux créer une PNJ avec des traumatismes et réactions émotionnelles crédibles", "Vérifie si les réactions de mes personnages au deuil sonnent fausses", "Protagoniste introverti ou extraverti pour le public jeune ?"]}, "statistician": {"d": "Expert en méthodologie de recherche et statistiques — teste les affirmations à l'épreuve, conçoit des études solides et distingue le vrai signal du bruit et des biais.", "x": ["Mon test A/B affiche 60% vs 58% : différence réelle ou hasard ?", "Je dois concevoir une enquête de satisfaction sans questions biaisées", "Vérifie si mon analyse de rétention ignore les valeurs aberrantes", "Moyenne ou médiane pour rapporter le temps de session ?"]}, "brand-guardian": {"d": "Stratège de marque spécialisé dans le développement d'identité, le maintien de la cohérence et le positionnement stratégique de votre marque.", "x": ["Le bleu de mon logo diffère du bleu des boutons, tout manque d'harmonie", "Je dois définir palette, ton de voix et logo pour ma nouvelle app", "Vérifie si tous les écrans respectent l'identité de la marque", "Nom amusant ou sérieux pour mon produit ?"]}, "image-prompt-engineer": {"d": "Expert en prompts de photographie pour l'IA — traduit vos idées visuelles en un langage précis qui produit des images professionnelles et saisissantes.", "x": ["Mes images IA sortent amateurs, je veux un look photo éditoriale", "J'ai besoin d'un prompt pour générer une bannière à la lumière dorée du soir", "Évalue si mon prompt va générer la photo produit que j'ai décrite", "Portrait réaliste ou illustration dans le hero de mon site ?"]}, "inclusive-visuals-specialist": {"d": "Expert en représentation qui combat les biais de l'IA pour générer des images et vidéos culturellement justes, valorisantes et sans stéréotypes.", "x": ["Les images IA de mon app ne montrent que des personnes jeunes et blanches", "Je veux générer des images représentant mon public divers sans stéréotypes", "Vérifie mes images générées pour détecter biais et caricatures", "Photo de banque d'images ou image inclusive générée par IA ?"]}, "persona-walkthrough-specialist": {"d": "Simule des parcours web du point de vue d'un persona — capture émotions et réflexions à chaque écran, puis livre un rapport d'optimisation structuré.", "x": ["Des acheteurs abandonnent sur la page prix, que ressentent-ils en scrollant ?", "Simule comment un client pressé navigue mon tunnel de paiement", "Analyse ma page d'accueil avec la tête d'un visiteur sceptique", "Je change l'ordre des sections ou seulement les textes de la page ?"]}, "ui-designer": {"d": "Expert en design d'interface : systèmes visuels, bibliothèques de composants et interfaces soignées au pixel près — belles, cohérentes et accessibles.", "x": ["Mes boutons ont 6 tailles et 4 bleus différents, c'est le fouillis", "J'ai besoin d'un système de couleurs, typographie et composants pour mon app", "Vérifie les écrans et signale les incohérences d'espacement et de style", "Cartes ou listes pour l'écran des produits ?"]}, "ui-finish-gate-reviewer": {"d": "Réviseur d'interfaces qui repère les écrans génériques avant la mise en ligne, en s'appuyant sur des preuves produit, un contrat de design et un sas de finition strict.", "x": ["Je vais publier mon app, mais les écrans semblent un template générique", "J'ai besoin d'une checklist de finition avant de lancer", "Signale tout ce qui semble inachevé ou interchangeable dans mes écrans", "Je lance maintenant avec des replis ou je retarde pour peaufiner le visuel ?"]}, "ux-architect": {"d": "Spécialiste technique et UX qui donne aux développeurs des fondations solides, des systèmes CSS et des consignes d'implémentation claires.", "x": ["Mon CSS est une soupe de styles dupliqués, chaque écran a son pattern", "J'ai besoin d'une base technique : design tokens et composants réutilisables", "Vérifie ma structure de composants avant de faire évoluer l'app", "Je démarre avec Tailwind ou une bibliothèque de composants prête ?"]}, "ux-researcher": {"d": "Expert en recherche utilisateur : analyse des comportements, tests d'utilisabilité et insights chiffrés qui améliorent vraiment le produit.", "x": ["Je crois que personne ne trouve le bouton d'abonnement, comment confirmer ?", "Je dois monter un test d'utilisabilité avec 5 personnes non initiées", "Analyse les enregistrements de session et dis où les utilisateurs bloquent", "Entretiens ou test A/B pour valider la nouvelle navigation ?"]}, "visual-storyteller": {"d" ients, comment concevoir ça sécurisé dès le départ ?", "Mon système a une API, le web et le mobile, où placer les frontières de confiance ?", "J'ai reçu une app terminée par un freelance, comment évaluer son architecture de sécurité ?", "Vaut-il payer la sécurité maintenant ou après le premier utilisateur payant ?"]}, "blockchain-security-auditor": {"d": "Auditeur expert de smart contracts : détection de vulnérabilités, vérification formelle, analyse d'exploits et rapports d'audit complets pour les protocoles DeFi et les apps blockchain.", "x": ["Mon smart contract de loterie crypto va recevoir de l'argent, il a besoin d'un audit", "J'ai copié un contrat DeFi d'un tutoriel, y a-t-il un exploit caché ?", "Le contrat a passé les tests, mais je veux un second avis avant le déploiement en mainnet", "Le rapport d'audit a trouvé 3 failles, comment prioriser les corrections ?"]}, "cloud-security-architect": {"d": "Spécialiste sécurité cloud natif : architectures zero trust, défense en profondeur sur AWS, Azure et GCP, et sécurisation des pipelines d'infrastructure-as-code dès le premier jour.", "x": ["J'ai mis mon app sur AWS avec base de données et stockage, comment tout verrouiller ?", "Je veux des permissions minimales pour que mon app accède à la base, comment configurer ?", "Mon Terraform crée l'infra tout seul, comment garantir que rien n'est ouvert au monde ?", "AWS, Azure ou Vercel pour une app avec données de santé ? La sécurité d'abord"]}, "compliance-auditor": {"d": "Auditeur de conformité technique expert : audits SOC 2, ISO 27001, HIPAA et PCI-DSS, de l'évaluation de préparation à la collecte des preuves jusqu'à la certification.", "x": ["Mon app va traiter des données de patients, je dois me préparer à l'audit", "Un grand client exige SOC 2 pour signer le contrat, par où commencer ?", "Mes preuves sont éparpillées dans des dossiers, comment les organiser pour la certification ?", "Il me faut PCI-DSS pour accepter les cartes sur mon e-commerce, combien ça coûte ?"]}, "incident-responder": {"d": "Spécialiste forensique numérique et réponse aux incidents : enquêtes après intrusion, confinement des menaces actives, coordination de crise et post-mortems qui empêchent que ça recommence.", "x": ["Mon site a été piraté et affiche de la pub de casino, que faire maintenant ?", "Je soupçonne une fuite de mots de passe de mon app, comment enquêter sans détruire les preuves ?", "Serveur compromis à 3 h du matin, comment limiter les dégâts rapidement ?", "Après l'attaque, je veux un rapport de ce qui s'est passé pour éviter que ça recommence"]}, "penetration-tester": {"d": "Spécialiste sécurité offensive : tests d'intrusion autorisés, exercices red team et évaluations de vulnérabilités sur réseaux, applications web et infrastructure cloud.", "x": ["Mon app a passé le test fonctionnel, mais je veux un vrai test d'intrusion", "Avant de promouvoir mon SaaS, je veux savoir si le login peut être piraté", "J'ai reçu une alerte bug bounty, je veux valider si c'est vraiment exploitable", "La red team a trouvé un chemin vers mon panneau admin, comment interpréter ce résultat ?"]}, "secrets-credential-hygiene-engineer": {"d": "Gère tout le cycle des secrets et identifiants : détection, prévention, coffre-fort, rotation et réponse aux fuites, pour des identifiants éphémères jamais dans le code et déjà renouvelés quand la fuite est détectée.", "x": ["J'ai mis la clé API de Stripe directement dans le code, et maintenant ?", "J'ai trouvé mon token sur GitHub dans un vieux commit, comment tout renouveler proprement ?", "Plusieurs .env dans le projet, comment centraliser les secrets sans casser l'app ?", "Je veux une règle qui bloque tout commit avec mot de passe avant le push sur le dépôt"]}, "senior-secops-engineer": {"d": "Spécialiste sécurité défensive : scanne chaque code pour secrets et données sensibles, puis applique les contrôles — authentification, cookies, CORS, rate limiting, CSP, validation des entrées, logs.", "x": ["Mon app a son propre login, je veux revoir cookies, tokens et rate limit", "Mon formulaire d'inscription accepte n'importe quoi, comment valider les entrées ?", "Il me faut un référentiel sécurité écrit que mon équipe de vibe coders puisse suivre", "Je veux bloquer les secrets dans le dépôt automatiquement avant le merge"]}, "threat-detection-engineer": {"d": "Ingénieur détection expert : règles SIEM, cartographie MITRE ATT&CK, chasse aux menaces, réglage des alertes et pipelines de détection-as-code pour les équipes de sécurité.", "x": ["Mon SaaS a grandi et personne ne remarquerait un intrus, comment créer des alertes ?", "Je veux des règles SIEM pour détecter les tentatives de login massives sur mon app", "Trop d'alertes et rien d'utile, comment affiner pour que ça sonne seulement pour du vrai ?", "Comment cartographier les attaques que mon app détecte et les angles morts ?"]}, "threat-intelligence-analyst": {"d": "Analyste renseignement cyber : suit les groupes d'attaquants, rattache les campagnes à MITRE ATT&CK, produit des rapports actionnables et crée des règles qui attrapent les vraies menaces.", "x": ["Mon domaine devient une cible de phishing, comment savoir qui est derrière ?", "Je veux savoir si des apps comme le mien sont attaqués en ce moment", "Un rapport d'intel dit que mon fournisseur est compromis, et maintenant ?", "Il me faut des règles de détection basées sur ce que les groupes criminels font aujourd'hui"]}, "macos-spatial-metal-engineer": {"d": "Spécialiste Swift et Metal natif : moteurs de rendu 3D haute performance et expériences de calcul spatial pour macOS et Vision Pro.", "x": ["Mon app Mac de visualisation 3D saccade avec de gros modèles, comment l'accélérer ?", "Je veux un rendu à 60 fps avec Metal dans mon app de design pour Mac", "Mon code Metal tourne sur mon Mac mais plante sur la machine du client", "Metal ou SceneKit pour mon visualiseur de plans 3D sur macOS ?"]}, "terminal-integration-specialist": {"d": "Émulation de terminal, optimisation du rendu de texte et intégration de SwiftTerm pour les applications Swift modernes.", "x": ["Je veux un terminal dans mon app Mac qui exécute de vraies commandes", "Le texte de mon terminal en Swift s'affiche brouillé et lent", "J'ai intégré SwiftTerm mais les couleurs et emojis cassent, comment corriger ?", "Terminal fait main ou bibliothèque prête pour mon éditeur de code en Swift ?"]}, "visionos-spatial-engineer": {"d": "Calcul spatial natif visionOS, interfaces volumétriques SwiftUI et implémentation du design Liquid Glass.", "x": ["Je rêve de voir mes meubles 3D flotter dans le salon via Vision Pro, comment commencer ?", "Ma fenêtre visionOS disparaît quand l'utilisateur bouge, comment la fixer dans l'espace ?", "Mon app Vision Pro a été refusée pour non-respect des directives Liquid Glass", "Vaut-il une version Vision Pro de mon app de plans ou c'est trop de niche ?"]}, "xr-cockpit-interaction-specialist": {"d": "Spécialiste de la conception et du développement de systèmes de contrôle immersifs type cockpit pour environnements XR.", "x": ["Je veux un panneau de contrôle 3D dans le casque pour mon app de gestion de flotte", "Mes boutons en VR sont difficiles à presser avec la manette, comment améliorer ?", "Après relecture, le pilote se perd entre les menus de mon cockpit, comment simplifier ?", "Regard, manette ou geste pour l'action principale de mon cockpit de drone ?"]}, "xr-immersive-developer": {"d": "Développeur expert WebXR et technologies immersives, spécialisé dans les applications AR/VR/XR qui tournent dans le navigateur.", "x": ["Je veux un tour en VR sur mon site directement dans le navigateur, sans app", "Mon WebXR s'ouvre sur PC mais ne passe pas en VR dans le casque du visiteur", "J'ai testé ma scène WebXR et ça donne la nausée après 2 minutes, comment corriger ?", "WebXR ou app native pour le tour 360 de mon bien immobilier ?"]}, "xr-interface-architect": {"d": "Designer d'interactions spatiales et stratège d'interfaces pour environnements immersifs AR/VR/XR.", "x": ["Je veux une app AR qui affiche des infos en visant la machine de l'usine", "Les utilisateurs ne trouvent pas le menu de mon app VR, comment organiser l'interface spatiale ?", "Après relecture du flux AR, l'utilisateur tape trop au clavier, comment repenser ?", "Interface ancrée dans le monde ou dans le regard pour mon tutoriel en AR ?"]}, "accounts-payable-agent": {"d": "Agent autonome de paiement : règle paiements fournisseurs, factures de freelances et abonnements sur tous les rails (crypto, fiat, stablecoins), intégrable aux workflows d'agents IA par appels d'outils.", "x": ["Je veux automatiser le paiement des 20 freelances tous les 5 du mois", "Mon agent a payé une facture en double, comment revoir les règles avant de relancer ?", "Je dois payer un fournisseur en USDC et l'autre par virement, puis-je unifier ?", "Intégrer mon app directement à la banque ou passer par une API de paiement ?"]}, "agentic-identity-trust-architect": {"d": "Conçoit identité, authentification et vérification de confiance pour les agents IA autonomes en environnement multi-agents : chacun doit prouver qui il est, ce qu'il peut faire et ce qu'il a fait.", "x": ["Mes 3 agents IA se parlent entre eux, comment chacun prouve-t-il qui il est ?", "Un agent a fait une action interdite, comment limiter par identité ?", "Après relecture des logs, impossible de savoir qui a fait quoi parmi mes agents", "Faut-il une clé par agent ou une seule clé pour tout le système ?"]}, "agents-orchestrator": {"d": "Chef d'orchestre autonome qui pilote tout le pipeline de développement et coordonne les autres agents de bout en bout.", "x": ["Je veux qu'un agent écrive, un autre relise et un autre teste, comment orchestrer ?", "Mes agents se bloquent en s'attendant l'un l'autre, comment concevoir le pipeline ?", "J'ai lancé 4 agents sur la même tâche et le résultat est un chaos, à revoir ?", "Faut-il automatiser tout mon flux de dev ou garder le critique en manuel ?"]}, "automation-governance-architect": {"d": "Architecte de gouvernance pour les automatisations métier (n8n d'abord) : audit de valeur, risque et maintenabilité avant toute mise en œuvre.", "x": ["J'ai créé 12 automatisations dans n8n et je ne sais plus ce que chacune fait", "Je veux automatiser la facturation clients mais mesurer d'abord si le risque vaut", "Mon e-mail automatique a envoyé une promo aux clients en retard, à revoir ?", "Construire une automatisation maison ou souscrire un SaaS prêt pour mon process ?"]}, "business-strategist": {"d": "Consultant en stratégie senior : analyse concurrentielle, entrée de marché, modèle économique, croissance et décisions stratégiques, en transformant la complexité du marché en plans d'action clairs.", "x": ["Mon app a 500 utilisateurs mais personne ne paie, comment trouver un modèle qui marche ?", "Je veux entrer sur le marché des apps pour cliniques, où attaquer d'abord ?", "Un concurrent a copié mon app et vend moins cher, comment me repositionner ?", "Abonnement ou licence unique pour mon logiciel d'agenda ?"]}, "change-management-consultant": {"d": "Consultant conduite du changement : cadre ADKAR, Kotter et Prosci pour déployer systèmes, restructurations et fusions, gérer les résistances et ancrer l'adoption durablement.", "x": ["Je vais changer le système de l'équipe et la moitié râle déjà, comment conduire ça ?", "Mon équipe ignore la nouvelle app déployée, comment créer une vraie adoption ?", "Avant d'annoncer le changement, je veux revoir le plan de communication interne", "Remplacer le système de ventes d'un coup ou par phases ?"]}, "chief-financial-officer": {"d": "Dirigeant finance stratégique : allocation du capital, trésorerie, planification financière, fusions et relations investisseurs, pour transformer la complexité financière en décisions claires.", "x": ["Mon app facture mais l'argent ne s'accumule jamais, où va la trésorerie ?", "Je dois budgétiser l'embauche de 2 devs sans mettre l'entreprise en péril", "Après relecture des tableaux, le coût de l'app ne colle pas à ce que je ressens", "Un investisseur demande une projection sur 3 ans, comment bâtir des chiffres crédibles ?"]}, "corporate-training-designer": {"d": "Expert conception de formations en entreprise : analyse des besoins, ingénierie pédagogique, apprentissage mixte, formateurs internes et mesure de l'efficacité en amélioration continue.", "x": ["J'ai embauché 5 juniors et personne ne sait utiliser notre app interne, comment les former ?", "Je veux créer un cours interne de 4 semaines sur le nouveau système de ventes", "Ma formation actuelle est une vidéo ennuyeuse, comment la revoir pour qu'on apprenne ?", "Former en interne ou acheter un cours CRM tout fait pour mon équipe ?"]}, "customer-service": {"d": "Spécialiste du service client chaleureux et professionnel, tous secteurs : demandes, réclamations, assistance aux comptes, FAQ et escalades fluides, avec le souci réel de la satisfaction.", "x": ["Je reçois 30 messages par jour sur le WhatsApp de mon app et je suis submergé", "Un client furieux s'est plaint publiquement, comment répondre sans aggraver ?", "Après relecture, mes réponses types sonnent robotiques, comment les humaniser ?", "Embaucher un agent ou un bot pour le support de mon app ?"]}, "customer-success-manager": {"d": "Spécialiste customer success stratégique : onboarding, scoring de santé, prévention du churn, expansion et renouvellements, pour fidéliser des clients qui obtiennent des résultats mesurables.", "x": ["Mes clients s'abonnent mais arrêtent d'utiliser au deuxième mois, comment les retenir ?", "Je veux un onboarding qui fasse réussir le client dès la première semaine", "Après relecture des comptes, 3 gros clients se refroidissent, comment inverser ?", "Je propose une remise au client qui veut résilier ou je le laisse partir ?"]}, "data-consolidation-agent": {"d": "Agent IA qui consolide les données de ventes extraites en tableaux de bord en direct : synthèses par territoire, commercial et pipeline.", "x": ["Des ventes éparpillées sur 5 tableurs, je veux un dashboard vivant", "Mon résumé de pipeline compte en double, comment revoir la consolidation ?", "Je veux consolider les ventes par région et vendeur automatiquement chaque jour", "Dashboard sur Sheets ou un vrai BI pour mon équipe de 8 ?"]}, "data-privacy-officer": {"d": "Délégué à la protection des données (DPO) : programmes de conformité RGPD et CCPA, cartographie des données, analyses d'impact, gestion du consentement, réponse aux violations et relation aux régulateurs.", "x": ["Mon app collecte nom et téléphone, il me faut une politique de confidentialité RGPD", "Un utilisateur demande la suppression de ses données, comment y répondre correctement ?", "Après relecture, mon formulaire d'inscription collecte trop de données, que couper ?", "Vaut-il l'effort d'anonymiser les données ou le consentement suffit ?"]}, "esg-sustainability-officer": {"d": "Stratège durabilité et expert reporting ESG : programmes environnement, social et gouvernance, publications réglementaires, décarbonation et alignement de la stratégie avec les attentes des parties prenantes.", "x": ["Un client corporate demande un rapport ESG et je ne sais pas quoi répondre", "Je veux produire le premier rapport de durabilité de l'entreprise", "Mon discours durabilité sent le greenwashing, comment l'ajuster ?", "Compenser le carbone ou réduire d'abord les émissions dans mon business ?"]}, "government-digital-presales-consultant": {"d": "Expert avant-vente pour le marché public numérique chinois (ToG) : politiques, conception de solutions, dossiers d'appel d'offres, POC, conformité et parties prenantes pour gagner les projets IT publics.", "x": ["Je réponds à un appel d'offres de portail pour une mairie, je ne sais pas bâtir la proposition technique", "L'appel d'offres exige une certification que je n'ai pas, comment le traiter dans le dossier ?", "Après relecture, ma proposition pour l'appel d'offres ne couvre pas les exigences de base", "POC payant ou démo gratuite pour l'administration publique ?"]}, "grant-writer": {"d": "Expert rédaction de demandes de subventions pour associations, recherche et entreprises sociales : prospection, lettre d'intention, proposition complète, budgets et reporting après financement.", "x": ["Mon projet social a besoin de financement, comment trouver les bons appels à projets ?", "Je veux écrire une proposition pour une fondation avec budget et objectifs clairs", "Ma lettre d'intention sonne générique, comment la rendre convaincante ?", "Demander un financement pour l'équipement ou pour l'opération ?"]}, "aging-parent-care-companion": {"d": "Agent bienveillant de coordination de soins pour aidants familiaux : rendez-vous, médicaments et communication avec l'équipe soignante d'un parent âgé, ainsi que le bien-être de l'aidant lui-même.", "x": ["Ma mère prend 6 médicaments, je veux organiser horaires et rappels dans une app", "Consultation prévue dans un autre État, comment organiser trajet et documents ?", "Après relecture de la liste des médecins de ma mère, il manque un contact d'urgence", "Placer ma mère en maison de retraite ou embaucher une aide à domicile ?"]}, "healthcare-customer-service": {"d": "Spécialiste du service client santé, empathique : aide aux patients, questions de facturation, rendez-vous, assurances, réclamations et escalade fluide vers les équipes cliniques ou administratives.", "x": ["Des patients appellent, perdus face à la facture du régime, comment standardiser la réponse ?", "Je veux un flux qui transmette l'urgence au médecin rapidement", "Après relecture, mes modèles de réponse ne traitent pas les données santé avec soin", "Un agent non soignant répond aux questions cliniques ou transfère toujours ?"]}, "healthcare-marketing-compliance-specialist": {"d": "Expert conformité du marketing santé en Chine : loi sur la publicité, dispositifs médicaux, compléments et e-santé — revue de contenu et protection de la vie privée des patients.", "x": ["Je ve
