<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Specialist Guide — Agency Agents</title>
<style>
:root{
  --bg:#f6f7f9; --card:#ffffff; --ink:#1a202c; --muted:#5a6472; --line:#e3e7ee;
  --accent:#4f46e5; --accent2:#0ea5a4; --claude:#d97757; --zcode:#4263eb;
  --ok:#16a34a; --warn:#d97706; --chip:#eef1f6; --shadow:0 1px 3px rgba(16,24,40,.08),0 1px 2px rgba(16,24,40,.04);
}
@media (prefers-color-scheme: dark){ :root{
  --bg:#0f1420; --card:#171e2e; --ink:#e8ecf3; --muted:#9aa4b5; --line:#2a3446;
  --accent:#818cf8; --accent2:#2dd4bf; --chip:#1e2739; --shadow:0 1px 3px rgba(0,0,0,.4);
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1200px;margin:0 auto;padding:24px 20px 80px}
header h1{font-size:26px;margin:0 0 6px}
header p.sub{color:var(--muted);margin:0 0 12px}
.langbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:0 0 18px}
.langbtn{border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:8px;padding:4px 10px;font-size:12.5px;cursor:pointer}
.langbtn.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.stats{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 22px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 16px;box-shadow:var(--shadow)}
.stat b{font-size:20px;display:block}
.stat span{color:var(--muted);font-size:12.5px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin:0 0 22px;box-shadow:var(--shadow)}
.panel h2{margin:0 0 10px;font-size:18px}
.panel ol,.panel ul{margin:8px 0 0;padding-left:22px}
.panel li{margin:4px 0}
kbd{background:var(--chip);border:1px solid var(--line);border-radius:5px;padding:1px 6px;font-size:12.5px}
.example{background:var(--chip);border-left:3px solid var(--accent);border-radius:0 8px 8px 0;padding:8px 12px;margin:6px 0;font-size:13.5px}
.badge{display:inline-block;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;margin-left:8px;vertical-align:middle;cursor:pointer}
.badge.new{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.toolgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.tool{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:5px;background:var(--card)}
.tool .t-head{display:flex;align-items:center;gap:8px;font-weight:600}
.tool .t-state{font-size:12px;border-radius:999px;padding:2px 9px;align-self:flex-start}
.st-ready{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok)}
.st-detected{background:color-mix(in srgb,var(--accent2) 14%,transparent);color:var(--accent2)}
.st-absent{background:var(--chip);color:var(--muted)}
.st-incompat{background:var(--chip);color:var(--muted)}
.st-unknown{background:color-mix(in srgb,var(--warn) 14%,transparent);color:var(--warn)}
.tool .t-desc{font-size:12.5px;color:var(--muted)}
.tool .t-dest{font-size:11.5px;color:var(--muted);font-family:ui-monospace,monospace}
.tool button{margin-top:6px;border:1px solid var(--accent);color:var(--accent);background:transparent;border-radius:8px;padding:6px 10px;font-size:12.5px;cursor:pointer}
.tool button:hover{background:var(--accent);color:#fff}
.mActions{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.btn{border:0;border-radius:10px;padding:10px 16px;font-size:14px;cursor:pointer;font-weight:600}
.btn.primary{background:var(--accent);color:#fff}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.primary:hover{filter:brightness(1.08)}
dialog{border:0;border-radius:16px;background:var(--card);color:var(--ink);max-width:640px;width:92vw;padding:0;box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(10,14,25,.55);backdrop-filter:blur(2px)}
.mWrap{padding:22px 24px}
.mWrap h3{margin:0 0 4px;font-size:19px}
.mWrap .mSub{color:var(--muted);font-size:13.5px;margin:0 0 16px}
.mStep{display:none}.mStep.on{display:block}
.opt{border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;margin:8px 0;cursor:pointer;display:flex;gap:10px;align-items:flex-start}
.opt:hover{border-color:var(--accent)}
.opt .o-t{font-weight:600;font-size:14px}
.opt .o-d{font-size:12.5px;color:var(--muted)}
.mNav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
.cmdBox{background:var(--chip);border-radius:10px;padding:10px 12px;font:12.5px/1.5 ui-monospace,monospace;word-break:break-all;margin:8px 0}
.muted{color:var(--muted)}
.bar{position:sticky;top:0;z-index:10;background:var(--bg);padding:14px 0 10px;border-bottom:1px solid var(--line);margin-bottom:16px}
.searchrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#q{flex:1;min-width:240px;padding:10px 14px;border:1.5px solid var(--line);border-radius:10px;font-size:15px;background:var(--card);color:var(--ink);outline:none}
#q:focus{border-color:var(--accent)}
.count{color:var(--muted);font-size:13px;white-space:nowrap}
label.tog{display:flex;gap:6px;align-items:center;font-size:13.5px;color:var(--muted);cursor:pointer;user-select:none}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer;transition:.15s}
.chip:hover{border-color:var(--accent)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chip small{opacity:.75}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px}
.card h3{margin:0;font-size:15.5px;line-height:1.35}
.card h3 small{color:var(--muted);font-weight:400;font-size:12px;margin-left:6px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:11.5px;border-radius:999px;padding:2px 9px;background:var(--chip);color:var(--muted)}
.tag.div{background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--accent)}
.tag.claude{background:color-mix(in srgb,var(--claude) 15%,transparent);color:var(--claude);font-weight:600}
.tag.zcode{background:color-mix(in srgb,var(--zcode) 15%,transparent);color:var(--zcode);font-weight:600}
.desc{font-size:13.8px;color:var(--ink)}
.when{font-size:13px;color:var(--muted);background:var(--chip);border-radius:9px;padding:8px 10px}
.when b{color:var(--ink);font-weight:600}
.when.hot{border-left:3px solid var(--accent2)}
.exList{margin:0;padding-left:18px;font-size:12.8px;color:var(--muted)}
.exList li{margin:3px 0}
details{font-size:12.8px;color:var(--muted)}
details summary{cursor:pointer;color:var(--accent);font-size:12.5px}
details pre{white-space:pre-wrap;word-break:break-word;margin:6px 0 0;font:12px/1.5 ui-monospace,monospace;color:var(--muted)}
.sep{margin:34px 0 14px;font-size:19px;font-weight:700}
.sep small{color:var(--muted);font-weight:400;font-size:13px;margin-left:8px}
.empty{color:var(--muted);text-align:center;padding:40px 0;font-size:14px}
footer{margin-top:44px;color:var(--muted);font-size:12.5px;text-align:center}
@media print{
  .bar,.langbar,.noprint{display:none} body{background:#fff} .panel,.card{box-shadow:none;border:1px solid #ddd}
  details{display:none} dialog{display:none!important}
}
</style>
</head>
<body>
<!-- estado da sua máquina, escrito pelo instalador (instaladores/). Se não existir, o guia segue funcionando. -->
<script src="guia-status.js"></script>
<div class="wrap">
<header>
  <h1 id="hTitle"></h1>
  <p class="sub" id="hSub"></p>
  <div class="langbar noprint" id="langbar"></div>
  <div class="stats">
    <div class="stat"><b id="stTotal">—</b><span id="stTotalL"></span></div>
    <div class="stat"><b id="stInst">—</b><span id="stInstL"></span></div>
    <div class="stat"><b id="stTools">—</b><span id="stToolsL"></span></div>
    <div class="stat"><b id="stDiv">—</b><span id="stDivL"></span></div>
  </div>
</header>

<div class="panel" id="machine">
  <h2 id="machineTitle"></h2>
  <p id="mStatus"></p>
  <div class="toolgrid" id="toolGrid"></div>
  <div class="mActions noprint">
    <button class="btn primary" id="btnWizard"></button>
    <button class="btn ghost" id="btnRecheck"></button>
  </div>
</div>

<div class="panel" id="howPanel">
  <h2 id="howTitle"></h2>
  <ol>
    <li id="how1"></li>
    <div class="example" id="howEx"></div>
    <li id="how2"></li>
    <li id="how3"></li>
  </ol>
</div>

<div class="panel" id="goldenPanel">
  <h2 id="goldenTitle"></h2>
  <ol>
    <li id="g1"></li><li id="g2"></li><li id="g3"></li><li id="g4"></li><li id="g5"></li>
  </ol>
</div>

<div class="bar noprint">
  <div class="searchrow">
    <input id="q" type="search" autocomplete="off">
    <label class="tog"><input type="checkbox" id="onlyInst"><span id="onlyInstL"></span></label>
    <span class="count" id="count"></span>
  </div>
  <div class="chips" id="chips"></div>
</div>

<div id="teamSep" class="sep"></div>
<div class="grid" id="teamGrid"></div>

<div id="catSep" class="sep"></div>
<div class="grid" id="grid"></div>
<div class="empty" id="empty" hidden></div>

<footer id="footer"></footer>
</div>

<dialog id="wiz">
  <div class="mWrap">
    <div class="mStep on" data-step="1">
      <h3 id="w1t"></h3>
      <p class="mSub" id="w1sub"></p>
      <div id="wizTools"></div>
      <div class="mNav"><span></span><button class="btn primary" id="wNext1"></button></div>
    </div>
    <div class="mStep" data-step="2">
      <h3 id="w2t"></h3>
      <p class="mSub" id="w2sub"></p>
      <div id="wizSquads"></div>
      <div class="mNav"><button class="btn ghost" id="wBack2"></button><button class="btn primary" id="wNext2"></button></div>
    </div>
    <div class="mStep" data-step="3">
      <h3 id="w3t"></h3>
      <p class="mSub" id="w3sub"></p>
      <ol>
        <li><span id="wStep1"></span>
          <div class="mNav" style="justify-content:flex-start"><button class="btn primary" id="wDownload"></button></div>
        </li>
        <li><span id="wStep2"></span>
          <div class="cmdBox" id="wCmd"></div>
          <p class="muted" style="font-size:12.5px" id="wNote"></p>
        </li>
      </ol>
      <div class="mNav"><button class="btn ghost" id="wBack3"></button><button class="btn primary" id="wClose"></button></div>
    </div>
  </div>
</dialog>

<script>
const DATA = {"version": "2.1.0", "ourRepo": "AtamisFilho/agency-agents-store", "langs": ["en", "pt", "es", "fr", "de"], "agents": [{"slug": "anthropologist", "name": "Anthropologist", "division": "academic", "inst_claude": false, "inst_zcode": false, "desc_en": "Expert in cultural systems, rituals, kinship, belief systems, and ethnographic method — builds culturally coherent societies that feel lived-in rather than invented", "file": "academic/academic-anthropologist.md", "custom_when": false}, {"slug": "geographer", "name": "Geographer", "division": "academic", "inst_claude": false, "inst_zcode": false, "desc_en": "Expert in physical and human geography, climate systems, cartography, and spatial analysis — builds geographically coherent worlds where terrain, climate, resources, and settlement patterns make scientific sense", "file": "academic/academic-geographer.md", "custom_when": false}, {"slug": "historian", "name": "Historian", "division": "academic", "inst_claude": false, "inst_zcode": false, "desc_en": "Expert in historical analysis, periodization, material culture, and historiography — validates historical coherence and enriches settings with authentic period detail grounded in primary and secondary sources", "file": "academic/academic-historian.md", "custom_when": false}, {"slug": "narratologist", "name": "Narratologist", "division": "academic", "inst_claude": false, "inst_zcode": false, "desc_en": "Expert in narrative theory, story structure, character arcs, and literary analysis — grounds advice in established frameworks from Propp to Campbell to modern narratology", "file": "academic/academic-narratologist.md", "custom_when": false}, {"slug": "psychologist", "name": "Psychologist", "division": "academic", "inst_claude": false, "inst_zcode": false, "desc_en": "Expert in human behavior, personality theory, motivation, and cognitive patterns — builds psychologically credible characters and interactions grounded in clinical and research frameworks", "file": "academic/academic-psychologist.md", "custom_when": false}, {"slug": "statistician", "name": "Statistician", "division": "academic", "inst_claude": false, "inst_zcode": false, "desc_en": "Expert in quantitative research methodology, experimental design, and statistical inference — pressure-tests claims, designs sound studies, and separates real signal from noise, chance, and bias", "file": "academic/academic-statistician.md", "custom_when": false}, {"slug": "brand-guardian", "name": "Brand Guardian", "division": "design", "inst_claude": false, "inst_zcode": false, "desc_en": "Expert brand strategist and guardian specializing in brand identity development, consistency maintenance, and strategic brand positioning", "file": "design/design-brand-guardian.md", "custom_when": false}, {"slug": "image-prompt-engineer", "name": "Image Prompt Engineer", "division": "design", "inst_claude": false, "inst_zcode": false, "desc_en": "Expert photography prompt engineer specializing in crafting detailed, evocative prompts for AI image generation. Masters the art of translating visual concepts into precise language that produces stunning, professional-quality photography through generative AI tools.", "file": "design/design-image-prompt-engineer.md", "custom_when": false}, {"slug": "inclusive-visuals-specialist", "name": "Inclusive Visuals Specialist", "division": "design", "inst_claude": false, "inst_zcode": false, "desc_en": "Representation expert who defeats systemic AI biases to generate culturally accurate, affirming, and non-stereotypical images and video.", "file": "design/design-inclusive-visuals-specialist.md", "custom_when": false}, {"slug": "persona-walkthrough-specialist", "name": "Persona Walkthrough Specialist", "division": "design", "inst_claude": false, "inst_zcode": false, "desc_en": "Simulate cognitive walkthroughs of web pages from a defined persona's psychological perspective — captures emotional reactions and rational thought at each scroll position, then delivers structured CRO reports grounded in LIFT, Cialdini, and Fogg frameworks", "file": "design/design-persona-walkthrough.md", "custom_when": false}, {"slug": "ui-designer", "name": "UI Designer", "division": "design", "inst_claude": false, "inst_zcode": false, "desc_en": "Expert UI designer specializing in visual design systems, component libraries, and pixel-perfect interface creation. Creates beautiful, consistent, accessible user interfaces that enhance UX and reflect brand identity", "file": "design/design-ui-designer.md", "custom_when": false}, {"slug": "ui-finish-gate-reviewer", "name": "UI Finish-Gate Reviewer", "division": "design", "inst_claude": false, "inst_zcode": false, "desc_en": "Product-interface reviewer who catches generic, interchangeable UI before it ships by grounding critique in real product evidence, a written design contract, and a hard implementation finish gate.", "file": "design/design-ui-finish-gate-reviewer.md", "custom_when": false}, {"slug": "ux-architect", "name": "UX Architect", "division": "design", "inst_claude": false, "inst_zcode": false, "desc_en": "Technical architecture and UX specialist who provides developers with solid foundations, CSS systems, and clear implementation guidance", "file": "design/design-ux-architect.md", "custom_when": false}, {"slug": "ux-researcher", "name": "UX Researcher", "division": "design", "inst_claude": false, "inst_zcode": false, "desc_en": "Expert user experience researcher specializing in user behavior analysis, usability testing, and data-driven design insights. Provides actionable research findings that improve product usability and user satisfaction", "file": "design/design-ux-researcher.md", "custom_when": false}, {"slug": "visual-storyteller", "name": "Visual Storyteller", "division": "design", "inst_claude": false, "inst_zcode": false, "desc_en": "Expert visual communication specialist focused on creating compelling visual narratives, multimedia content, and brand storytelling through design. Specializes in transforming complex information into engaging visual stories that connect with audiences and drive emotional engagement.", "file": "design/design-visual-storyteller.md", "custom_when": false}, {"slug": "whimsy-injector", "name": "Whimsy Injector", "division": "design", "inst_claude": false, "inst_zcode": false, "desc_en": "Expert creative specialist focused on adding personality, delight, and playful elements to brand experiences. Creates memorable, joyful interactions that differentiate brands through unexpected moments of whimsy", "file": "design/design-whimsy-injector.md", "custom_when": false}, {"slug": "ai-data-remediation-engineer", "name": "AI Data Remediation Engineer", "division": "engineering", "inst_claude": false, "inst_zcode": false, "desc_en": "Specialist in self-healing data pipelines — uses air-gapped local SLMs and semantic clustering to automatically detect, classify, and fix data anomalies at scale. Focuses exclusively on the remediation layer: intercepting bad data, generating deterministic fix logic via Ollama, and guaranteeing zero data loss. Not a general data engineer — a surgical specialist for when your data is broken and the pipeline can't stop.", "file": "engineering/engineering-ai-data-remediation-engineer.md", "custom_when": false}, {"slug": "ai-engineer", "name": "AI Engineer", "division": "engineering", "inst_claude": false, "inst_zcode": false, "desc_en": "Expert AI/ML engineer specializing in machine learning model development, deployment, and integration into production systems. Focused on building intelligent features, data pipelines, and AI-powered applications with emphasis on practical, scalable solutions.", "file": "engineering/engineering-ai-engineer.md", "custom_when": false}, {"slug": "api-platform-engineer", "name": "API Platform Engineer", "division": "engineering", "inst_claude": false, "inst_zcode": false, "desc_en": "Expert API platform engineer for public and partner APIs — contract-first design (OpenAPI/gRPC), versioning and deprecation policy, SDK generation, API gateway concerns (auth, rate limiting, quotas), and developer-portal DX.", "file": "engineering/engineering-api-platform-engineer.md", "custom_when": false}, {"slug": "ats-validator-architect", "name": "ATS Validator Architect", "division": "engineering", "inst_claude": false, "inst_zcode": false, "desc_en": "Architect and validator for Applicant Tracking Systems (ATS) and resume parsers. Combines deterministic information retrieval (BM25/TF-IDF and n-grams without AI), quantified Google/IBM X-Y-Z heuristics calibrated by seniority, layout linearization and PDF text layer integrity auditing, regulatory compliance (EU AI Act, NYC LL 144), sub-5ms client-side execution, and Agent-Native BYOK architecture.", "file": "engineering/engineering-ats-validator-architect.md", "custom_when": false}, {"slug": "autonomous-optimization-architect", "name": "Autonomous Optimization Architect", "division": "engineering", "inst_claude": false, "inst_zcode": false, "desc_en": "Intelligent system governor that continuously shadow-tests APIs for performance while enforcing strict financial and security guardrails against runaway costs.", "file": "engineering/engineering-autonomous-optimization-architect.md", "custom_when": false}, {"slug": "backend-architect", "name": "Backend Architect", "division": "engineering", "inst_claude": false, "inst_zcode": false, "desc_en": "Senior backend architect specializing in scalable system design, database architecture, API development, and cloud infrastructure. Builds robust, secure, performant server-side applications and microservices", "file": "engineering/engineering-backend-architect.md", "custom_when": false}, {"slug": "china-network-engineer", "name": "China Network Engineer", "division": "engineering", "inst_claude": false, "inst_zcode": false, "desc_en": "Expert in mainland China's mainstream enterprise networking stacks — Huawei VRP, H3C Comware, Ruijie RGOS, and Hillstone S  everything or separate flows per user role?"]}, "study-abroad-advisor": {"d": "Full-spectrum study abroad planning expert covering the US, UK, Canada, Australia, Europe, Hong Kong, and Singapore — proficient in undergraduate, master's, and PhD application strategy, school selection, essay coaching, profile enhancement, standardized test planning, visa preparation, and overseas life adaptation, helping Chinese students craft personalized end-to-end study abroad plans.", "x": ["My daughter wants a master's in Canada; where do we start?", "I want a 12-month plan with tests, essays, and scholarships organized.", "I reviewed her essay and it reads like a list of achievements, not a personal story.", "Invest in a prep course or a private tutor for the test?"]}, "supply-chain-strategist": {"d": "Expert supply chain management and procurement strategy specialist — skilled in supplier development, strategic sourcing, quality control, and supply chain digitalization. Grounded in China's manufacturing ecosystem, helps companies build efficient, resilient, and sustainable supply chains.", "x": ["I'm importing components for my gadget and don't know how to pick a supplier.", "I need a sourcing plan with 2 suppliers so I don't depend on 1.", "I reviewed lead times and every China order ships late.", "Produce in China or find a supplier closer to home?"]}, "zk-steward": {"d": "Knowledge-base steward in the spirit of Niklas Luhmann's Zettelkasten. Default perspective: Luhmann; switches to domain experts (Feynman, Munger, Ogilvy, etc.) by task. Enforces atomic notes, connectivity, and validation loops. Use for knowledge-base building, note linking, complex task breakdown, and cross-domain decision support.", "x": ["I have 300 scattered notes with nothing connected; I want a knowledge base.", "I need to break my huge project into atomic, linked notes.", "I reviewed my Zettelkasten and there are duplicate notes with no links.", "Organize notes by project or by concept in my base?"]}, "analytics-reporter": {"d": "Expert data analyst transforming raw data into actionable business insights. Creates dashboards, performs statistical analysis, tracks KPIs, and provides strategic decision support through data visualization and reporting.", "x": ["I have a 10,000-row sales spreadsheet and want to see the patterns inside it.", "I need a dashboard showing my app's KPIs in near real time.", "I reviewed my monthly report and no one understands my charts.", "Active users or revenue as the north star of my dashboard?"]}, "executive-summary-generator": {"d": "Consultant-grade AI specialist trained to think and communicate like a senior strategy consultant. Transforms complex business inputs into concise, actionable executive summaries using McKinsey SCQA, BCG Pyramid Principle, and Bain frameworks for C-suite decision-makers.", "x": ["I wrote a 20-page analysis and the investor wants 1 page; how do I summarize?", "I need an executive summary so the board can choose between 2 vendors.", "I reviewed my summary and it became a bullet list with no clear recommendation.", "Open my summary with the recommendation or with context?"]}, "finance-tracker": {"d": "Expert financial analyst and controller specializing in financial planning, budget management, and business performance analysis. Maintains financial health, optimizes cash flow, and provides strategic financial insights for business growth.", "x": ["My app money is mixed with my personal money; I want to separate and plan.", "I need a monthly budget with a cash projection for the next 6 months.", "I reviewed my cash flow and discover late receivables too late.", "Keep the surplus in cash or invest it in a marketing campaign?"]}, "infrastructure-maintainer": {"d": "Expert infrastructure specialist focused on system reliability, performance optimization, and technical operations management. Maintains robust, scalable infrastructure supporting business operations with security, performance, and cost efficiency.", "x": ["My app goes down every Monday morning; I want to find and fix the cause.", "I need infrastructure that scales during the Black Friday peak without breaking.", "I reviewed my server and the disk filled up from accumulated logs.", "A dedicated server or serverless for my new SaaS?"]}, "legal-compliance-checker": {"d": "Expert legal and compliance specialist ensuring business operations, data handling, and content creation comply with relevant laws, regulations, and industry standards across multiple jurisdictions.", "x": ["My app will operate in Europe; I need to know which laws apply.", "I want to check whether my terms of use and privacy policy are OK.", "I reviewed my data collection process and a consent step is missing.", "Set up a local entity or operate from abroad in the new country?"]}, "support-responder": {"d": "Expert customer support specialist delivering exceptional customer service, issue resolution, and user experience optimization. Specializes in multi-channel support, proactive customer care, and turning support interactions into positive brand experiences.", "x": ["Users open tickets and answers take 2 days; I want to improve that.", "I need multi-channel support (email, chat, WhatsApp) for my app.", "I reviewed my support replies and they only resolve half the cases.", "A public FAQ or a chatbot to cut repeated tickets?"]}, "accessibility-auditor": {"d": "Expert accessibility specialist who audits interfaces against WCAG standards, tests with assistive technologies, and ensures inclusive design. Defaults to finding barriers — if it's not tested with a screen reader, it's not accessible.", "x": ["A blind user said they can't buy on my site; how do I review it?", "I want to test my app with a screen reader before the next release.", "I reviewed my form and validation errors aren't announced to the screen reader.", "Fix the essentials now or rebuild everything to WCAG?"]}, "api-tester": {"d": "Expert API testing specialist focused on comprehensive API validation, performance testing, and quality assurance across all systems and third-party integrations", "x": ["My payment integration fails 1 in 10 times; how do I test it better?", "I need to validate my new API with error and limit cases before launch.", "I reviewed my API tests and they only cover the happy path.", "Postman, a custom script, or a test framework for my suite?"]}, "evidence-collector": {"d": "Screenshot-obsessed, fantasy-allergic QA specialist - Reports reproducible issues with evidence and marks untested scope honestly", "x": ["My beta broke but the bug vanished; I need screenshots and clear steps.", "I want evidence for every screen tested before approving the release.", "I reviewed the QA report and there are no screenshots; it can't be reproduced.", "Accept 'it should work' or demand evidence for every flow?"]}, "performance-benchmarker": {"d": "Expert performance testing and optimization specialist focused on measuring, analyzing, and improving system performance across all applications and infrastructure", "x": ["My site takes 5s to load; I want to measure and find the real bottleneck.", "I need a benchmark with 500 simulated users before the campaign.", "I reviewed my app and the main screen runs the same query 40 times.", "Optimize the database, cache, or frontend first?"]}, "reality-checker": {"d": "Stops fantasy approvals, evidence-based certification - Default to \"NEEDS WORK\", requires overwhelming proof for production readiness", "x": ["My AI agent said everything is done, but nothing was actually tested.", "Before launch, I want a skeptic who demands proof of every promise.", "I reviewed the release checklist and half of it says 'OK' with no evidence.", "Launch on Friday or wait for real checkout tests?"]}, "test-automation-engineer": {"d": "Expert end-to-end test automation engineer for Playwright and Cypress — resilient selectors, flake elimination, isolated test data, CI parallelization, and trace-driven failure debugging.", "x": ["I test my app by hand every week; I want to automate it.", "I need a Playwright E2E suite that runs on every commit.", "I reviewed my E2E tests and 3 break every build from flaky selectors.", "Cypress or Playwright for my React app?"]}, "test-results-analyzer": {"d": "Expert test analysis specialist focused on comprehensive test result evaluation, quality metrics analysis, and actionable insight generation from testing activities", "x": ["My suite runs 900 tests and 60 fail; I want to know what actually matters.", "I need a quality report for my app with metrics that make sense.", "I reviewed my test logs and one failure has repeated since 3 builds ago.", "Fix all 60 failures or filter out the flakiness?"]}, "tool-evaluator": {"d": "Expert technology assessment specialist focused on evaluating, testing, and recommending tools, software, and platforms for business use and productivity optimization", "x": ["I need to choose between 5 CRM tools and I'm lost.", "I want to compare the costs and risks of 3 e-commerce platforms.", "I reviewed the analytics tools I tested and my criteria changed midway.", "Pay for a tool right away or run a 30-day free pilot?"]}, "workflow-optimizer": {"d": "Expert process improvement specialist focused on analyzing, optimizing, and automating workflows across all business functions for maximum productivity and efficiency", "x": ["I do manual invoicing every day and it takes 2 hours; I want to cut that.", "I need to map my onboarding process and find what to automate.", "I reviewed my approval flow and every request passes through 5 people.", "Automate all at once or optimize in stages?"]}}, "when": {"div": {"academic": "When the project involves fictional worlds, serious research, or content that needs real grounding.", "design": "When you need to improve how the app looks, how usable it is, or the overall user experience.", "engineering": "When you need to build, fix, or improve the project's code and infrastructure.", "finance": "When you need to make sense of numbers, pricing, budgets, or the business's financial health.", "game-development": "When the project is a game or has game elements.", "gis": "When the project involves maps, geographic data, or location.", "healthcare": "When the project is in healthcare and needs to follow industry rules.", "marketing": "When you need to attract, engage, or retain users with content.", "paid-media": "When you're paying for ads and want to improve the return on every dollar spent.", "product": "When you need to decide WHAT to build and in what order.", "project-management": "When you need to organize tasks, deadlines, and the team's workflow.", "research": "When you need to separate fact from opinion in research and sources.", "sales": "When you need to sell, prospect for customers, or look after existing ones.", "security": "Before launch and whenever user data is involved — it's the project's life insurance.", "spatial-computing": "When the project involves augmented/virtual reality or advanced 3D.", "specialized": "Special roles for specific situations — come here when you face an unusual challenge.", "support": "When you need to care for customers after launch or organize day-to-day operations.", "testing": "Before declaring anything “done” — this is where the proof that it works lives."}, "custom": {"code-reviewer": "After any major code change. Say: “use the code-reviewer to review change X with a focus on correctness and security”.", "devops-automator": "When it's time to set up the deploy, the CI/CD, and publish the platform (e.g., deploy on Zorin/Docker).", "reality-checker": "Before believing anything is done. Say: “verify with evidence that X actually works”. It accepts no promises, only proof.", "api-tester": "To test the backend routes end to end (login, matches, invites, rankings, payments).", "test-automation-engineer": "To create the automated test suite that runs on its own with every change (Playwright/Cypress).", "evidence-collector": "To turn “I tested it and it works” into a report with reproducible proof — and honestly mark what wasn't tested.", "accessibility-auditor": "Before public launch: makes sure the app works for everyone (keyboard, screen readers, contrast).", "performance-benchmarker": "When the app is slow or before launch, to measure and improve speed with hard numbers.", "penetration-tester": "MANDATORY before opening to the public: simulates real attacks to find gaps before criminals do.", "application-security-engineer": "To review the security of new code: exposed secrets, permissions, injection flaws.", "threat-detection-engineer": "After launch: sets up the monitoring and alerts that detect attacks in production.", "sprint-prioritizer": "At the start of each cycle: turns “everything is urgent” into an ordered plan with a clear first milestone."}}}, "pt": {"agents": {"anthropologist": {"d": "Entende culturas, rituais, famílias e crenças. Cria sociedades fictícias coerentes que parecem reais e vividas, não inventadas.", "x": ["Minha comunidade fictícia do app parece sem vida, faltam rituais e costumes", "Preciso criar tradições e hierarquias sociais críveis para as facções do meu jogo", "Revise se os costumes que inventei batem entre si e soam reais", "Basear minha tribo numa cultura real ou inventar do zero?"]}, "geographer": {"d": "Entende geografia, clima e mapas. Cria mundos coerentes onde terreno, clima, recursos e povoados fazem sentido do ponto de vista científico.", "x": ["No meu mapa há deserto colado em floresta tropical, jogadores acham estranho", "Preciso posicionar cidades, rios e recursos de forma realista no meu mundo", "Confira se clima e relevo combinam com onde coloquei as vilas", "Cenário principal: terreno vulcânico ou planície fértil?"]}, "historian": {"d": "Analisa história e épocas passadas. Confere se seu cenário faz sentido histórico e o enriquece com detalhes autênticos baseados em fontes reais.", "x": ["Meu RPG mistura armaduras e moedas de épocas diferentes, como arrumar?", "Quero detalhes autênticos do cotidiano na minha vila medieval", "Cheque se a linha do tempo do meu enredo tem buracos históricos", "Ambientar no século XIV ou inventar um reino fictício?"]}, "narratologist": {"d": "Entende teoria de histórias: estrutura, arcos de personagens e análise literária. Baseia os conselhos em modelos clássicos e modernos de narrativa.", "x": ["Minha história trava no meio, o herói perde o motivo de seguir", "Preciso estruturar os atos da minha narrativa interativa", "Analise se os arcos dos meus personagens fecham no final", "Jornada do herói clássica ou estrutura não linear?"]}, "psychologist": {"d": "Entende comportamento humano, personalidade e motivação. Cria personagens e interações psologicamente críveis, baseadas em estudos reais.", "x": ["Usuários acham meu vilão raso: ele só age por ódio", "Quero criar uma NPC com traumas e reações emocionais críveis", "Revise se as reações dos meus personagens ao luto soam falsas", "Protagonista introvertido ou extrovertido pro público jovem?"]}, "statistician": {"d": "Entende números, pesquisas e experimentos. Testa afirmações, cria estudos confiáveis e separa o que é real de ruído, sorte e viés.", "x": ["Meu teste A/B mostra 60% vs 58%, é diferença real ou sorte?", "Preciso montar uma pesquisa de satisfação sem perguntas enviesadas", "Cheque se minha análise de retenção ignora outliers", "Média ou mediana pra relatar o tempo de sessão?"]}, "brand-guardian": {"d": "Especialista em marcas: cria e protege a identidade da marca, mantém a consistência e define o posicionamento estratégico.", "x": ["O azul do meu logo é diferente do azul dos botões, tudo destoa", "Preciso definir paleta, tom de voz e logo pro meu novo app", "Revise se todas as telas seguem a identidade da marca", "Nome divertido ou sério pro meu produto?"]}, "image-prompt-engineer": {"d": "Cria descrições detalhadas para gerar imagens com IA. Traduz ideias visuais em instruções precisas que resultam em fotos de qualidade profissional.", "x": ["Minhas imagens de IA saem amadoras, quero cara de foto editorial", "Preciso de prompt pra gerar banner com luz dourada de fim de tarde", "Avalie se meu prompt vai gerar a foto de produto que descrevi", "Retrato realista ou ilustração no hero do meu site?"]}, "inclusive-visuals-specialist": {"d": "Especialista em representação que combate vieses da IA para gerar imagens e vídeos culturalmente precisos, positivos e sem estereótipos.", "x": ["As imagens de IA do meu app só mostram pessoas jovens e brancas", "Quero gerar imagens que representem meu público diverso sem estereótipo", "Revise minhas imagens geradas pra checar viés e caricaturas", "Foto de banco de imagens ou imagem inclusiva gerada por IA?"]}, "persona-walkthrough-specialist": {"d": "Simula como diferentes perfis de usuários pensam e se sentem ao navegar numa página, avaliando cada seção e entregando relatórios para aumentar conversões.", "x": ["Compradores desistem na página de preço, o que sentem ao rolar?", "Simule como um cliente apressado navega meu checkout", "Analise minha home pela cabeça de um visitante cético", "Mudo a ordem das seções ou só os textos da página?"]}, "ui-designer": {"d": "Desenha interfaces bonitas, consistentes e acessíveis. Cria sistemas de design e componentes visuais que melhoram a experiência e refletem a marca.", "x": ["Meus botões têm 6 tamanhos e 4 azuis diferentes, está bagunçado", "Preciso de sistema de cores, tipografia e componentes pro meu app", "Revise as telas e aponte inconsistências de espaçamento e estilo", "Cards ou listas pra tela de produtos?"]}, "ui-finish-gate-reviewer": {"d": "Revisa interfaces antes do lançamento e barra designs genéricos, usando evidências do produto, um contrato de design claro e critérios rígidos de acabamento.", "x": ["Vou publicar meu app, mas as telas parecem template genérico", "Preciso de checklist de acabamento antes de lançar", "Aponte tudo que parece inacabado ou trocável nas minhas telas", "Lanço agora com fallbacks ou atraso pra polir o visual?"]}, "ux-architect": {"d": "Especialista em arquitetura e experiência do usuário: dá aos desenvolvedores bases sólidas, sistemas de CSS e orientações claras de implementação.", "x": ["Meu CSS virou sopa de estilos duplicados, cada tela um padrão", "Preciso de base técnica: design tokens e componentes reutilizáveis", "Revise minha estrutura de componentes antes de escalar o app", "Começo com Tailwind ou biblioteca pronta de componentes?"]}, "ux-researcher": {"d": "Pesquisa como as pessoas usam produtos: analisa comportamento, testa usabilidade e entrega descobertas práticas que aumentam a satisfação do usuário.", "x": ["Acho que ninguém encontra o botão de assinar, como confirmar isso?", "Preciso montar um teste de usabilidade com 5 pessoas leigas", "Analise as gravações de sessão e diga onde os usuários travam", "Entrevistas ou teste A/B pra validar a nova navegação?"]}, "visual-storyteller": {"d": "Transforma informações complexas em histórias visuais envolventes. Cria narrativas, conteúdo multimídia e storytelling de marca que conectam com o público.", "x": ["Minha página sobre é um muro de texto, ninguém lê", "Preciso transformar meus dados de impacto em visual pra home", "Revise se a sequência de imagens da home conta uma história", "Vídeo animado ou carrossel de imagens na landing?"]}, "whimsy-injector": {"d": "Adiciona personalidade, alegria e toques divertidos à experiência da marca, criando interações memoráveis que a diferenciam dos concorrentes.", "x": ["Meu app funciona, mas é sem graça, ninguém comenta nada", "Quero microinterações divertidas ao concluir tarefas", "Revise onde o app pode surpreender sem atrapalhar a tarefa", "Confete ao concluir ou algo mais sutil?"]}, "ai-data-remediation-engineer": {"d": "Especialista em consertar dados automaticamente: detecta, classifica e corrige erros em pipelines sem parar tudo nem perder dados, usando modelos de IA locais.", "x": ["Meu pipeline para toda noite por causa de dados sujos do fornecedor", "Preciso limpar automaticamente CPFs e datas erradas em 2M de linhas", "Revise minha lógica de correção de dados antes de rodar em produção", "Corrijo na entrada com regras ou reprocesso tudo à mão?"]}, "ai-engineer": {"d": "Cria e coloca no ar funcionalidades com IA: desenvolve modelos de machine learning, pipelines de dados e apps inteligentes com soluções práticas e escaláveis.", "x": ["Quero sugerir produtos no carrinho com IA, por onde começo?", "Preciso integrar um modelo de classificação na minha API de suporte", "Revise custo e latência das minhas chamadas de modelo em produção", "API pronta da OpenAI ou modelo open source local?"]}, "api-platform-engineer": {"d": "Especialista em APIs públicas e de parceiros: desenha contratos, versiona, gera SDKs, cuida de segurança, limites de uso e do portal para desenvolvedores.", "x": ["Vou abrir minha API pra parceiros e não sei versionar nem limitar uso", "Preciso de documentação OpenAPI, portal de chaves e rate limiting", "Revise o contrato da minha API antes de publicar pra terceiros", "Versão na URL (/v2) ou por header?"]}, "ats-validator-architect": {"d": "Arquiteta e valida sistemas de triagem de currículos (ATS): analisa textos sem IA, otimiza currículos, garante conformidade legal e execução rápida no navegador.", "x": ["Meu site de currículos rejeita PDFs que os usuários juram estar ok", "Preciso pontuar currículos por palavras-chave sem usar IA paga", "Revise se meu parser lida com currículos de duas colunas e foto", "Analiso com IA ou com regras determinísticas?"]}, "autonomous-optimization-architect": {"d": "Governador inteligente que testa APIs em segundo plano, melhorando desempenho com limites rígidos de custo e segurança para evitar gastos fora de controle.", "x": ["Minha conta de nuvem dobrou e tenho medo de rodar testes de IA 24h", "Preciso de limites de custo enquanto testo a performance da API", "Revise se meu teste de carga pode gerar prejuízo sem controle", "Paro o pipeline por custo ou deixo rodando com guardrails?"]}, "backend-architect": {"d": "Arquiteta o lado invisível dos apps: sistemas escaláveis, bancos de dados, APIs e nuvem. Constrói servidores robustos, seguros e rápidos.", "x": ["Meu app engasga com 200 usuários, o backend é um arquivo só", "Preciso desenhar API, banco e filas pra um app de agendamentos", "Revise a arquitetura do backend antes de eu add pagamentos", "Monolito simples ou microserviços desde o início?"]}, "china-network-engineer": {"d": "Especialista em equipamentos de rede da China (Huawei, H3C, Ruijie, Hillstone): roteamento, switches, firewalls, NAT e regras locais de segurança.", "x": ["Meu servidor na China não acessa os serviços Huawei que contratei", "Preciso configurar firewalls Huawei e NAT pra filial em Shenzhen", "Revise se minha borda de rede atende o padrão MLPS 2.0 local", "Equipamentos Huawei ou H3C na filial chinesa?"]}, "cms-developer": {"d": "Especialista em Drupal e WordPress: cria temas, plugins personalizados, organiza conteúdo e implementa tudo via código.", "x": ["Preciso que clientes editem textos do site sem mexer em código", "Quero um tipo de conteúdo 'eventos' com data e imagem no WordPress", "Revise meu tema WordPress antes de publicar, tem código duplicado", "WordPress ou Drupal pro portal institucional?"]}, "code-reviewer": {"d": "Revisa código com feedback construtivo e prático, focado em funcionar certo, ser fácil de manter, seguro e rápido — sem implicar com estilo.", "x": ["Meu app funciona, mas tem funções de 500 linhas no código", "Preciso revisar o código gerado por IA antes de subir pra produção", "Aponte bugs e riscos de segurança no meu módulo de login", "Refatoro agora ou junto com a próxima feature?"]}, "codebase-onboarding-engineer": {"d": "Ajuda desenvolvedores a entender códigos novos rapidamente: lê o código-fonte, segue os caminhos da lógica e só afirma o que está escrito no código.", "x": ["Comprei um projeto pronto e não sei onde ica cresceu, tem como mapear onde ela pode ser atacada?", "Time pequeno sem know-how de segurança, como tornar código seguro o padrão?"]}, "security-architect": {"d": "Arquiteto de segurança que desenha a proteção de sistemas: mapeia ameaças, cria defesas em camadas e avalia riscos em sites, APIs e nuvem. O trabalho fino no código fica com o especialista de AppSec.", "x": ["Vou juntar app, pagamentos e dados de clientes, como desenhar isso seguro desde o início?", "Meu sistema tem API, web e celular, onde ficam as fronteiras de confiança?", "Recebi o app pronto de um freelancer, como avaliar a arquitetura de segurança?", "Vale pagar segurança agora ou só depois do primeiro usuário pagante?"]}, "blockchain-security-auditor": {"d": "Auditor especialista em contratos inteligentes: encontra falhas, analisa ataques e escreve relatórios completos de auditoria para protocolos DeFi e aplicativos de blockchain.", "x": ["Meu smart contract de rifa em cripto vai receber dinheiro, precisa de auditoria", "Copiei um contrato DeFi de tutorial, tem exploit escondido?", "Contrato passou nos testes mas quero segunda opinião antes de publicar na mainnet", "Relatório de auditoria apontou 3 falhas, como priorizar o conserto?"]}, "cloud-security-architect": {"d": "Especialista em segurança na nuvem: cria arquiteturas de confiança zero, aplica proteções em camadas na AWS, Azure e GCP e deixa os pipelines de infraestrutura seguros desde o primeiro dia.", "x": ["Subi meu app na AWS com banco e storage, como travar tudo direito?", "Quero permissões mínimas pro meu app acessar o banco, como configurar?", "Meu Terraform cria infra sozinho, como garantir que nada fica aberto ao mundo?", "AWS, Azure ou Vercel pro app com dados de saúde? Segurança em primeiro lugar"]}, "compliance-auditor": {"d": "Auditor técnico de conformidade especializado em certificações como SOC 2, ISO 27001, HIPAA e PCI-DSS — da avaliação inicial, à coleta de evidências, até a certificação final.", "x": ["Vou processar dados de pacientes no meu app, preciso me preparar pra auditoria", "Cliente grande pediu SOC 2 pra fechar contrato, por onde começo?", "Tenho proofs espalhados em pastas, como organizar evidências pra certificação?", "Preciso de PCI-DSS pra aceitar cartão no meu e-commerce, quanto custa?"]}, "incident-responder": {"d": "Especialista em resposta a incidentes digitais: investiga invasões, contém ameaças em andamento, coordena a crise e escreve relatórios que evitam que o problema se repita.", "x": ["Meu site foi invadido e mostra propaganda de casino, o que faço agora?", "Suspeito que vazaram senhas do meu app, como investigar sem destruir provas?", "Servidor comprometido às 3 da manhã, como conter o estrago rapidinho?", "Depois do ataque, quero relatório do que aconteceu pra não repetir"]}, "penetration-tester": {"d": "Especialista em segurança ofensiva: faz testes de invasão autorizados e simula ataques (red team) para descobrir brechas em redes, sites e infraestrutura na nuvem.", "x": ["Meu app passou no teste funcional, mas queria um teste de invasão de verdade", "Antes de divulgar meu SaaS, quero saber se dá pra invadir o login", "Recebi alerta de bug bounty, quer validar se é explorável de verdade", "Red team achou caminho pro meu painel admin, como interpreto o achado?"]}, "secrets-credential-hygiene-engineer": {"d": "Cuida do ciclo de senhas e chaves de acesso: detectar, proteger, guardar e trocar. O app roda com credenciais limitadas que nunca ficam no código e já foram trocadas quando um vazamento aparece.", "x": ["Coloquei a chave da API do Stripe direto no código, e agora?", "Achei meu token no GitHub num commit antigo, como girar tudo com segurança?", "Vários .env pelo projeto, como centralizar segredos sem quebrar o app?", "Quero regra que bloqueie commit com senha antes de subir pro repositório"]}, "senior-secops-engineer": {"d": "Especialista em segurança defensiva: escaneia cada código novo atrás de senhas expostas e dados sensíveis, e depois implementa ão com SwiftTerm para aplicativos Swift modernos.", "x": ["Quero um terminal dentro do meu app Mac que rode comandos de verdade", "Texto do meu terminal em Swift aparece embaralhado e lento", "Integrei SwiftTerm mas cores e emojis quebram, como revisar?", "Terminal feito na mão ou lib pronta pro meu editor de código em Swift?"]}, "visionos-spatial-engineer": {"d": "Especialista em computação espacial nativa do visionOS: interfaces 3D volumétricas com SwiftUI e implementação do design Liquid Glass.", "x": ["Sonho em ver meus móveis 3D flutuando na sala via Vision Pro, como começar?", "Minha janela visionOS some quando o usuário anda, como fixar no espaço?", "Meu app Vision Pro foi recusado por quebrar diretrizes de Liquid Glass", "Vale fazer versão Vision Pro do meu app de plantas ou é nicho demais?"]}, "xr-cockpit-interaction-specialist": {"d": "Especialista em projetar e desenvolver sistemas de controle imersivos em estilo cockpit para ambientes de realidade extendida (XR).", "x": ["Quero painel 3D de controle no headset pro meu app de gestão de frota", "Meus botões no VR são difíceis de apertar com controle, como melhorar?", "Revi minha UI de cockpit e o piloto se perde entre menus, como simplificar?", "Olhar, controle ou gesto pra ação principal no meu cockpit de drone?"]}, "xr-immersive-developer": {"d": "Desenvolvedor experiente em WebXR e tecnologias imersivas, focado em aplicativos de AR/VR/XR que rodam direto no navegador.", "x": ["Quero que meu site tenha tour em VR direto no navegador, sem app", "Meu WebXR abre no PC mas não entra em VR no óculos do visitante", "Testei minha cena WebXR e dá enjoo após 2 minutos, como revisar?", "WebXR ou app nativo pro tour 360 do meu imóvel?"]}, "xr-interface-architect": {"d": "Designer de interação espacial e estrategista de interfaces para ambientes imersivos de AR/VR/XR.", "x": ["Quero criar app AR que mostre infos ao apontar pra máquina da fábrica", "Usuários não acham o menu no meu app VR, como organizar a interface isão, leitura de nunchi, etiqueta no KakaoTalk, hierarquias e negociação baseada em relacionamentos.", "x": ["Vou me reunir com cliente coreano e não sei como me dirigir ao CEO dele", "Preciso entender como a decisão passa pela hierarquia antes de propor", "Revi meu e-mail pro parceiro de Seul e soei agressivo demais", "Negociar por KakaoTalk ou pedir reunião formal?"]}, "master-plan-architect": {"d": "Arquiteto de planejamento mestre e crítico impiedoso de planos: ensina arquitetura a fundo, aponta riscos (red team) e cria planos de implementação completos, sem executar código.", "x": ["Tenho ideia de app grande e quero um plano de implementação sem código", "Meu plano de 6 meses parece bonito, quero alguém que destrua os riscos", "Revi meu roadmap e faltam as dependências entre as fases", "Construir tudo de uma vez ou MVP em 6 semanas?"]}, "mcp-builder": {"d": "Desenvolvedor especialista no Model Context Protocol: desenha, constrói e testa servidores MCP que ampliam agentes de IA com ferramentas, recursos e prompts personalizados.", "x": ["Quero que meu agente acesse meu banco de dados, ouvi falar de MCP", "Preciso construir servidor MCP que exponha meus relatórios ao Claude", "Testei meu MCP server e a tool falha ao passar arquivo grande", "Criar tool custom ou usar API direta no meu agente?"]}, "model-qa-specialist": {"d": "Auditor independente de modelos de IA e estatística: revisa documentação, reconstrói dados, replica resultados, testa calibração e interpreta desempenho com relatórios de nível de auditoria.", "x": ["Meu modelo de previsão de vendas parece ótimo em teste e ruim na prática", "Quero auditoria independente do modelo antes de usar com clientes", "Revi meu modelo e não sei se os dados de treino vazaram pro teste", "Retreinar com mais dados ou trocar de algoritmo?"]}, "pricing-analyst": {"d": "Analista de preços: define modelos de precificação ideais com pesquisa de mercado, análise de concorrentes, custos e margens — tirando o preço do achismo e virando vantagem com dados.", "x": ["Cobrei R$49 no meu app e ninguém compra, R$19 seria melhor?", "Quero montar tabela de planos com pesquisa de concorrentes", "Revi meus preços e o custo por usuário come o lucro do plano básico", "Cobrar por usuário ou por uso no meu SaaS?"]}, "salesforce-architect": {"d": "Arquitetura de soluções na plataforma Salesforce: design multi-nuvem, padrões de integração, limites do sistema, estratégia de deploy e governança de dados em empresas grandes.", "x": ["Minha empresa migrou pro Salesforce e nada se conecta, quero desenhar certo", "Preciso de modelo de dados e integração entre Sales e Service Cloud", "Revi meu org e batemos no limite de governor em todo script", "Instalar app do AppExchange ou desenvolver custom?"]}, "strategy-duel-agent": {"d": "Conduz duelos de estratégia ao vivo usando teoria dos jogos e as 36 estratagemas chinesas.", "x": ["Concorrente me copia e corta preço todo mês, estou sem resposta", "Quero simular um duelo estratégico antes de lançar meu novo produto", "Revi meu plano de ataque ao rival e não considerei a reação dele", "Responder o concorrente de frente ou manobrar por fora pro meu app?"]}, "workflow-architect": {"d": "Especialista em desenhar fluxos de trabalho completos: mapeia todos os caminhos, falhas e recuperações de cada sistema e jornada, gerando especificações prontas para construir e testar.", "x": ["Quero desenhar o fluxo completo do meu app de agendamento antes de codar", "Meu app trava quando o pagamento falha, preciso mapear caminhos de erro", "Revi meu fluxo de cadastro e tem 4 estados que ninguém especificou", "Um fluxo só pra tudo ou fluxos separados por perfil de usuário?"]}, "study-abroad-advisor": {"d": "Consultor completo de estudo no exterior (EUA, Reino Unido, Canadá, Austrália, Europa e Ásia): estratégia de candidatura, escolha de escola, ensaios, testes, visto e adaptação.", "x": ["Minha filha quer fazer mestrado no Canadá, por onde começar?", "Quero plano de 12 meses com provas, essays e bolsas organizados", "Revi o essay dela e soa lista de conquistas, não história pessoal", "Investir em curso preparatório ou tutor individual pra prova?"]}, "supply-chain-strategist": {"d": "Especialista em cadeia de suprimentos e compras: desenvolvimento de fornecedores, sourcing estratégico, controle de qualidade e digitalização, com base no ecossistema industrial chinês.", "x": ["Vou importar componentes pra meu gadget e não sei escolher fornecedor", "Preciso de plano de sourcing com 2 fornecedores pra não depender de 1", "Revi meus lead times e a produção atrasa todo pedido da China", "Produzir na China ou procurar fornecedor mais perto?"]}, "zk-steward": {"d": "Cuidador de base de conhecimento inspirado no Zettelkasten de Luhmann: exige notas atômicas, conexões e validação. Ótimo para construir bases, ligar notas e quebrar tarefas complexas.", "x": ["Tenho 300 notas espalhadas e nada se conecta, quero virar base de conhecimento", "Preciso quebrar meu projeto gigante em notas atômicas que se linkam", "Revi meu Zettelkasten e tem notas duplicadas sem link nenhum", "Notas por projeto ou por conceito na minha base?"]}, "analytics-reporter": {"d": "Analista de dados que transforma números brutos em insights práticos: cria painéis, faz análises estatísticas, acompanha KPIs e apoia decisões com visualizações e relatórios.", "x": ["Tenho planilha de vendas com 10 mil linhas e quero ver padrões ali dentro", "Preciso de dashboard que mostre os KPIs do meu app em tempo quase real", "Revi meu relatório mensal e ninguém entende os gráficos que fiz", "Métrica de usuários ativos ou de receita como norte do meu painel?"]}, "executive-summary-generator": {"d": "Gera resumos executivos dignos de consultoria: transforma informações complexas em sínteses concisas e acionáveis para a alta direção, com frameworks de McKinsey, BCG e Bain.", "x": ["Escrevi análise de 20 páginas e o investidor quer 1 página, como resumir?", "Preciso do resumo executivo pro board decidir entre 2 fornecedores", "Revi meu resumo e virou lista de tópicos sem recomendação clara", "Abrir com recomendação ou com contexto no meu sumário?"]}, "finance-tracker": {"d": "Analista e controlador financeiro: cuida de planejamento, orçamentos e desempenho do negócio, mantendo a saúde financeira e otimizando o fluxo de caixa.", "x": ["Meu dinheiro do app se mistura com o pessoal, quero separar e planejar", "Preciso de orçamento mensal com projeção de caixa pros próximos 6 meses", "Revi meu fluxo de caixa e descubro atraso de recebível tarde demais", "Guardar sobra em caixa ou investir na campanha de marketing?"]}, "infrastructure-maintainer": {"d": "Especialista em infraestrutura: mantém sistemas confiáveis, escaláveis e seguros, otimizando desempenho e custos para sustentar as operações do negócio.", "x": ["Meu app cai toda segunda de manhã, quero entender e resolver a causa", "Preciso de infra que escale no pico da Black Friday sem quebrar", "Revi meu servidor e o disco encheu por causa de logs acumulados", "Servidor dedicado próprio ou serverless pra meu novo SaaS?"]}, "legal-compliance-checker": {"d": "Especialista em jurídico e conformidade: garante que operações, dados e conteúdos cumpram leis, regulamentos e normas do setor em vários países.", "x": ["Meu app vai operar na Europa, preciso saber quais leis se aplicam", "Quero checar se meus termos de uso e política de privacidade estão ok", "Revi meu processo de coleta de dados e tem consentimento faltando", "Abrir empresa local ou operar de fora no novo país?"]}, "support-responder": {"d": "Especialista em suporte ao cliente: resolve problemas em vários canais, cuida proativamente do cliente e transforma atendimentos em experiências positivas da marca.", "x": ["Meus usuários mandam ticket e a resposta demora 2 dias, quero melhorar", "Preciso montar atendimento multicanal (e-mail, chat, WhatsApp) pro app", "Revi minhas respostas de suporte e elas resolvem só metade dos casos", "FAQ pública ou chatbot pra reduzir tickets repetidos?"]}, "accessibility-auditor": {"d": "Especialista em acessibilidade: audita interfaces segundo as normas WCAG e testa com leitores de tela. Se não foi testado com screen reader, não é acessível.", "x": ["Usuário cego reclamou que não consegue comprar no meu site, como revisar?", "Quero testar meu app com leitor de tela antes do próximo release", "Revi meu formulário e os erros de validação não são anunciados ao leitor", "Corrigir agora o essencial ou refazer tudo conforme WCAG?"]}, "api-tester": {"d": "Especialista em testes de APIs: valida tudo de ponta a ponta, testa performance e garante qualidade em todos os sistemas e integrações de terceiros.", "x": ["Minha integração com pagamento falha 1 em cada 10, como testar melhor?", "Preciso validar minha API nova com casos de erro e limite antes do lançamento", "Revi meus testes de API e eles só cobrem o caminho feliz", "Postman, script próprio ou framework de teste pra minha suíte?"]}, "evidence-collector": {"d": "QA obcecado por evidências e alérgico a fantasia: reporta problemas reproduzíveis com provas e marca honestamente o que não foi testado.", "x": ["Meu beta quebrou mas o bug sumiu, preciso de screenshots e passos claros", "Quero evidência de cada tela testada antes de aprovar o release", "Revi o relatório de QA e não tem print nenhum, não dá pra reproduzir", "Aceitar 'deve estar funcionando' ou exigir evidência de cada fluxo?"]}, "performance-benchmarker": {"d": "Especialista em performance: mede, analisa e melhora o desempenho de todos os aplicativos e infraestruturas.", "x": ["Meu site demora 5s pra abrir, quero medir e achar o gargalo real", "Preciso de benchmark com 500 usuários simulados antes da campanha", "Revi meu app e a tela principal refaz a mesma consulta 40 vezes", "Otimizar banco, cache ou frontend primeiro?"]}, "reality-checker": {"d": "Impede aprovações por ilusão: certifica com base em evidências. O padrão é PRECISA DE MELHORIAS — só libera para produção com provas contundentes.", "x": ["Meu agente de IA disse que tá tudo pronto, mas nada foi testado de verdade", "Antes de lançar, quero alguém cético que exija prova de cada promessa", "Revi o checklist do release e metade diz 'OK' sem evidência", "Lançar sexta ou esperar os testes reais do checkout?"]}, "test-automation-engineer": {"d": "Engenheiro de testes automatizados ponta a ponta (Playwright e Cypress): seletores resistentes, sem testes instáveis, dados isolados, paralelismo em CI e depuração guiada por traces.", "x": ["Testo meu app clicando na mão toda semana, quero automatizar isso", "Preciso de suíte E2E com Playwright que rode a cada commit", "Revi meus testes E2E e 3 quebram por seletor instável toda build", "Cypress ou Playwright pro meu app React?"]}, "test-results-analyzer": {"d": "Especialista em analisar resultados de testes: avalia qualidade, calcula métricas e extrai insights acionáveis das atividades de teste.", "x": ["Minha suíte roda 900 testes e falha 60, quero saber o que de fato importa", "Preciso de relatório de qualidade do meu app com métricas que façam sentido", "Revi meus logs de teste e tem falha que se repete desde 3 builds atrás", "Corrigir os 60 falhos ou filtrar o que é instabilidade?"]}, "tool-evaluator": {"d": "Especialista em avaliar tecnologias: testa, compara e recomenda ferramentas, softwares e plataformas para uso no negócio e ganho de produtividade.", "x": ["Preciso escolher entre 5 ferramentas de CRM e estou perdido", "Quero comparar custos e riscos de 3 plataformas de e-commerce", "Revi as ferramentas de analytics que testei e os critérios mudaram no meio", "Ferramenta paga de imediato ou piloto grátis de 30 dias?"]}, "workflow-optimizer": {"d": "Especialista em melhoria de processos: analisa, otimiza e automatiza fluxos de trabalho em todas as áreas para máxima produtividade e eficiência.", "x": ["Faço faturamento manual todo dia e leva 2h, quero cortar isso", "Preciso mapear meu processo de onboarding e achar o que automatizar", "Revi meu fluxo de aprovação e cada pedido passa por 5 pessoas", "Automatizar de uma vez ou otimizar em etapas?"]}}, "when": {"div": {"academic": "Quando o projeto envolver mundos fictícios, pesquisa séria ou conteúdo que precisa de embasamento real.", "design": "Quando precisar melhorar a aparência, a usabilidade ou a experiência de uso do app.", "engineering": "Quando precisar construir, consertar ou melhorar o código e a infraestrutura do projeto.", "finance": "Quando precisar entender números, preços, orçamento ou a saúde financeira do negócio.", "game-development": "Quando o projeto for um jogo ou tiver elementos de jogo.", "gis": "Quando o projeto envolver mapas, dados geográficos ou localização.", "healthcare": "Quando o projeto estiver na área da saúde e precisar seguir as regras do setor.", "marketing": "Quando precisar atrair, engajar ou fidelizar usuários com conteúdo.", "paid-media": "Quando estiver pagando por anúncios e quiser melhorar o retorno de cada real investido.", "product": "Quando precisar decidir O QUE construir e em que ordem.", "project-management": "Quando precisar organizar tarefas, prazos e o fluxo de trabalho do time.", "research": "Quando precisar separar fato de opinião em pesquisas e fontes.", "sales": "Quando precisar vender, prospectar clientes ou cuidar da carteira existente.", "security": "Antes do lançamento e sempre que envolver dados de usuários — é o seguro de vida do projeto.", "spatial-computing": "Quando o projeto envolver realidade aumentada/virtual ou 3D avançado.", "specialized": "Papéis especiais para situações específicas — navegue aqui quando tiver um desafio fora do comum.", "support": "Quando precisar cuidar do cliente depois do lançamento ou organizar a operação do dia a dia.", "testing": "Antes de declarar qualquer coisa “pronta” — é aqui que vive a prova de que funciona."}, "custom": {"code-reviewer": "Depois de qualquer mudança de código importante. Diga: “use o code-reviewer para revisar a mudança X com foco em correção e segurança”.", "devops-automator": "Na hora de montar o deploy, o CI/CD e publicar a plataforma (ex.: deploy no Zorin/Docker).", "reality-checker": "Antes de acreditar que algo está pronto. Diga: “verifique com provas se X realmente funciona”. Ele não aceita promessa, só evidência.", "api-tester": "Para testar as rotas do backend de ponta a ponta (login, partidas, convites, rankings, pagamentos).", "test-automation-engineer": "Para criar a suíte de testes automatizados que roda sozinha a cada mudança (Playwright/Cypress).", "evidence-collector": "Para transformar “testei e funciona” em relatório com provas reproduzíveis — e marcar honestamente o que não foi testado.", "accessibility-auditor": "Antes do lançamento público: garante que o app serve a todo mundo (teclado, leitores de tela, contraste).", "performance-benchmarker": "Quando o app estiver lento ou antes do lançamento, para medir e melhorar a velocidade com números.", "penetration-tester": "OBRIGATÓRIO antes de abrir ao público: simula ataques reais para achar brechas antes dos criminosos acharem.", "application-security-engineer": "Para revisar a segurança do código novo: segredos expostos, permissões, falhas de injeção.", "threat-detection-engineer": "Depois do lançamento: configura o monitoramento e os alertas que detectam ataques em produção.", "sprint-prioritizer": "No começo de cada ciclo: transforma “tudo é urgente” num plano ordenado com primeiro marco claro."}}}, "es": {"agents": {"anthropologist": {"d": "Experto en sistemas culturales, rituales, parentesco, creencias y etnografía: crea sociedades ficticias coherentes que parecen vividas, no inventadas", "x": ["Mi comunidad ficticia del app parece sin vida, faltan rituales y costumbres", "Necesito crear tradiciones y jerarquías sociales creíbles para las facciones de mi juego", "Revisa si las costumbres que inventé son coherentes entre sí y suenan reales", "¿Basar mi tribu en una cultura real o inventarla desde cero?"]}, "geographer": {"d": "Expert
