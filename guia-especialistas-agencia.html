": "Analyste de données expert : transforme les données brutes en insights actionnables, crée des dashboards, mène des analyses statistiques et suit les KPI pour éclairer les décisions.", "x": ["J'ai un tableur de ventes avec 10 000 lignes et je veux en repérer les schémas", "Il me faut un dashboard qui montre les KPI de mon app en quasi temps réel", "Après relecture de mon rapport mensuel, personne ne comprend mes graphiques", "Utilisateurs actifs ou revenus comme boussole de mon tableau de bord ?"]}, "executive-summary-generator": {"d": "Spécialiste IA niveau consultant : pense et rédige comme un consultant senior, transforme des entrées complexes en synthèses exécutives concises (SCQA McKinsey, principe pyramidal BCG) pour dirigeants.", "x": ["J'ai écrit 20 pages d'analyse et l'investisseur veut 1 page, comment condenser ?", "Il me faut la synthèse exécutive pour que le board choisisse entre 2 fournisseurs", "Après relecture, ma synthèse est devenue une liste sans recommandation claire", "Ouvrir ma synthèse par la recommandation ou par le contexte ?"]}, "finance-tracker": {"d": "Analyste financier et contrôleur de gestion : planification financière, gestion des budgets et analyse de performance, pour garder l'entreprise en bonne santé et optimiser la trésorerie.", "x": ["L'argent de l'app se mélange au perso, je veux séparer et planifier", "Je veux un budget mensuel avec projection de trésorerie sur 6 mois", "En relisant ma trésorerie, je découvre les retards de paiement trop tard", "Garder l'excédent en trésorerie ou investir en marketing ?"]}, "infrastructure-maintainer": {"d": "Spécialiste infrastructure : fiabilité des systèmes, optimisation des performances et gestion des opérations techniques, pour une infra robuste, scalable, sûre et efficiente en coûts.", "x": ["Mon app tombe chaque lundi matin, je veux comprendre et corriger la cause", "Il me faut une infra qui tient le pic de la Black Friday sans casser", "Après relecture du serveur, le disque a saturé à cause des logs accumulés", "Serveur dédié ou serverless pour mon nouveau SaaS ?"]}, "legal-compliance-checker": {"d": "Expert juridique et conformité : vérifie que les opérations, le traitement des données et les contenus respectent lois, règlements et normes sectorielles, sur plusieurs juridictions.", "x": ["Mon app va opérer en Europe, je dois savoir quelles lois s'appliquent", "Je veux vérifier que mes CGU et ma politique de confidentialité tiennent debout", "Après relecture du processus de collecte, il manque un consentement", "Créer une entreprise locale ou opérer depuis l'extérieur ?"]}, "support-responder": {"d": "Spécialiste support client : résolution des problèmes, service multicanal et soin proactif, pour transformer chaque échange de support en expérience de marque positive.", "x": ["Mes utilisateurs envoient des tickets et la réponse prend 2 jours, je veux améliorer", "Je dois monter un support multicanal (e-mail, chat, WhatsApp) pour l'app", "Après relecture, mes réponses de support ne résolvent que la moitié des cas", "FAQ publique ou chatbot pour réduire les tickets répétitifs ?"]}, "accessibility-auditor": {"d": "Expert accessibilité : audite les interfaces selon WCAG, teste avec les technologies d'assistance et garantit un design inclusif. Cherche les barrières : pas de test lecteur d'écran, pas d'accessibilité.", "x": ["Un utilisateur aveugle n'arrive pas à acheter sur mon site, comment corriger ?", "Je veux tester mon app avec un lecteur d'écran avant le prochain release", "Après relecture du formulaire, les erreurs ne sont pas annoncées au lecteur d'écran", "Corriger l'essentiel maintenant ou tout refaire selon WCAG ?"]}, "api-tester": {"d": "Expert test d'API : validation complète des API, tests de performance et assurance qualité sur tous les systèmes et intégrations tierces.", "x": ["Mon intégration de paiement échoue 1 fois sur 10, comment mieux tester ?", "Je dois valider ma nouvelle API avec erreurs et limites avant le lancement", "Après relecture, mes tests d'API ne couvrent que le chemin heureux", "Postman, script maison ou framework de test pour ma suite ?"]}, "evidence-collector": {"d": "Spécialiste QA obsédé par les preuves et allergique aux fictions : rapporte les bugs reproductibles avec captures et signale honnêtement ce qui n'a pas été testé.", "x": ["Mon beta a planté mais le bug a disparu, il me faut des screenshots et des étapes claires", "Je veux la preuve de chaque écran testé avant d'approuver le release", "Le rapport QA n'a aucun print, impossible de reproduire le bug", "Accepter « ça devrait marcher » ou exiger la preuve de chaque flux ?"]}, "performance-benchmarker": {"d": "Expert test de performance : mesure, analyse et améliore les performances de toutes les applications et de l'infrastructure.", "x": ["Mon site met 5 s à s'ouvrir, je veux mesurer et trouver le vrai goulot d'étranglement", "Il me faut un benchmark avec 500 utilisateurs simulés avant la campagne", "Après relecture, mon écran principal rejoue la même requête 40 fois", "Optimiser la base, le cache ou le frontend en premier ?"]}, "reality-checker": {"d": "Bloque les validations fantaisistes, certifie sur preuves : verdict par défaut « à retravailler », exige une preuve écrasante avant la mise en production.", "x": ["Mon agent IA dit que tout est prêt mais rien n'a été vraiment testé", "Avant de lancer, je veux un sceptique qui exige la preuve de chaque promesse", "Après relecture du checklist, la moitié dit « OK » sans preuve", "Lancer vendredi ou attendre les tests réels du checkout ?"]}, "test-automation-engineer": {"d": "Ingénieur automatisation de tests E2E sur Playwright et Cypress : sélecteurs résilients, élimination du flaky, données isolées, parallélisation en CI et débogage par trace.", "x": ["Je teste mon app en cliquant à la main chaque semaine, je veux automatiser", "Il me faut une suite E2E Playwright qui tourne à chaque commit", "Après relecture, 3 tests E2E cassent à chaque build par sélecteur instable", "Cypress ou Playwright pour mon app React ?"]}, "test-results-analyzer": {"d": "Expert analyse de tests : évaluation complète des résultats, métriques de qualité et insights actionnables à partir des activités de test.", "x": ["Ma suite lance 900 tests et en rate 60, je veux savoir ce qui compte vraiment", "Il me faut un rapport qualité de mon app avec des métriques qui ont du sens", "Après relecture des logs, une même panne se répète depuis 3 builds", "Corriger les 60 échecs ou filtrer ce qui est de l'instabilité ?"]}, "tool-evaluator": {"d": "Expert évaluation technologique : teste et recommande outils, logiciels et plateformes pour l'usage métier et l'optimisation de la productivité.", "x": ["Je dois choisir entre 5 outils CRM et je suis perdu", "Je veux comparer coûts et risques de 3 plateformes e-commerce", "Après relecture des outils analytics testés, les critères ont changé en cours de route", "Outil payant tout de suite ou pilote gratuit de 30 jours ?"]}, "workflow-optimizer": {"d": "Expert amélioration de processus : analyse, optimise et automatise les workflows de toutes les fonctions pour productivité et efficacité maximales.", "x": ["Je fais la facturation à la main chaque jour en 2 h, je veux couper ça", "Je dois cartographier mon process d'onboarding et repérer quoi automatiser", "Après relecture du flux d'approbation, chaque demande passe par 5 personnes", "Automatiser d'un coup ou optimiser par étapes ?"]}}, "when": {"div": {"academic": "Quand le projet touche des mondes fictifs, une recherche sérieuse ou un contenu qui exige un socle réel.", "design": "Quand tu dois améliorer l'apparence, l'ergonomie ou l'expérience d'usage de l'app.", "engineering": "Quand tu dois construire, réparer ou améliorer le code et l'infrastructure du projet.", "finance": "Quand tu dois comprendre les chiffres, les prix, le budget ou la santé financière du business.", "game-development": "Quand le projet est un jeu ou contient des éléments de jeu.", "gis": "Quand le projet implique des cartes, des données géographiques ou la localisation.", "healthcare": "Quand le projet est dans la santé et doit respecter les règles du secteur.", "marketing": "Quand tu dois attirer, engager ou fidéliser des utilisateurs avec du contenu.", "paid-media": "Quand tu paies des annonces et veux améliorer le retour de chaque euro investi.", "product": "Quand tu dois décider QUOI construire et dans quel ordre.", "project-management": "Quand tu dois organiser tâches, délais et flux de travail de l'équipe.", "research": "Quand tu dois séparer les faits des opinions dans les recherches et sources.", "sales": "Quand tu dois vendre, prospecter des clients ou gérer le portefeuille existant.", "security": "Avant le lancement et dès que des données utilisateurs entrent en jeu — c'est l'assurance-vie du projet.", "spatial-computing": "Quand le projet implique la réalité augmentée/virtuelle ou de la 3D avancée.", "specialized": "Rôles spéciaux pour des cas précis — viens ici quand tu affrontes un défi hors du commun.", "support": "Quand tu dois prendre soin des clients après le lancement ou organiser l'opérationnel du quotidien.", "testing": "Avant de déclarer quoi que ce soit « prêt » — c'est ici que vit la preuve que ça marche."}, "custom": {"code-reviewer": "Après toute modification de code importante. Dis : « utilise code-reviewer pour revoir le changement X avec un focus correction et sécurité ».", "devops-automator": "Au moment de monter le déploiement, le CI/CD et de publier la plateforme (ex. : déploiement sur Zorin/Docker).", "reality-checker": "Avant de croire que c'est prêt. Dis : « vérifie avec des preuves si X marche vraiment ». Il n'accepte pas la promesse, seulement l'évidence.", "api-tester": "Pour tester les routes du backend de bout en bout (connexion, matchs, invitations, classements, paiements).", "test-automation-engineer": "Pour créer la suite de tests automatisés qui tourne seule à chaque changement (Playwright/Cypress).", "evidence-collector": "Pour transformer « j'ai testé et ça marche » en rapport avec preuves reproductibles — et marquer honnêtement ce qui n'a pas été testé.", "accessibility-auditor": "Avant le lancement public : garantit que l'app sert tout le monde (clavier, lecteurs d'écran, contraste).", "performance-benchmarker": "Quand l'app est lente ou avant le lancement, pour mesurer et améliorer la vitesse avec des chiffres.", "penetration-tester": "OBLIGATOIRE avant d'ouvrir au public : simule des attaques réelles pour trouver les brèches avant les criminels.", "application-security-engineer": "Pour revoir la sécurité du code nouveau : secrets exposés, permissions, failles d'injection.", "threat-detection-engineer": "Après le lancement : configure la surveillance et les alertes qui détectent les attaques en production.", "sprint-prioritizer": "Au début de chaque cycle : transforme « tout est urgent » en plan ordonné avec un premier jalon clair."}}}, "de": {"agents": {"anthropologist": {"d": "Experte für Kultursysteme, Rituale, Verwandtschaft und Glaubenswelten – erschafft kulturell stimmige Gesellschaften, die echt gelebt wirken statt erfunden.", "x": ["Meine fiktive Community in der App wirkt leblos, Rituale und Bräuche fehlen.", "Ich brauche glaubwürdige Traditionen und soziale Hierarchien für die Fraktionen meines Spiels.", "Prüfe, ob meine erdachten Bräuche zusammenpassen und echt wirken.", "Soll ich meinen Stamm auf einer echten Kultur aufbauen oder frei erfinden?"]}, "geographer": {"d": "Experte für physische und menschliche Geografie, Klimasysteme, Kartografie und Raumanalyse – erschafft geografisch stimmige Welten, in denen Terrain, Klima, Ressourcen und Siedlungen wissenschaftlich Sinn ergeben.", "x": ["Auf meiner Karte grenzt Wüste direkt an Tropenwald, Spieler finden das seltsam.", "Ich muss Städte, Flüsse und Ressourcen realistisch in meiner Welt platzieren.", "Prüfe, ob Klima und Gelände zu den Orten passen, an die ich die Dörfer gesetzt habe.", "Hauptszenario: vulkanisches Gelände oder fruchtbare Ebene?"]}, "historian": {"d": "Experte für Geschichtsanalyse, Epochen, Alltagskultur und Geschichtsschreibung – prüft historische Stimmigkeit und bereichert Settings mit authentischen Zeitdetails aus Quellen.", "x": ["Mein RPG mischt Rüstungen und Münzen aus verschiedenen Epochen – wie fixe ich das?", "Ich will authentische Alltagsdetails für mein mittelalterliches Dorf.", "Prüfe, ob meine Handlungs-Zeitleiste historische Lücken hat.", "Handlung ins 14. Jahrhundert oder ein fiktives Königreich erfinden?"]}, "narratologist": {"d": "Experte für Erzähltheorie, dramatische Struktur, Charakterbögen und Literaturanalyse – stützt Ratschläge auf etablierte Modelle von Propp über Campbell bis zur modernen Erzählforschung.", "x": ["Meine Geschichte stockt in der Mitte, der Held verliert seinen Antrieb.", "Ich muss die Akte meiner interaktiven Erzählung strukturieren.", "Analysiere, ob die Charakterbögen am Ende sauber aufgehen.", "Klassische Heldenreise oder nichtlineare Struktur?"]}, "psychologist": {"d": "Experte für menschliches Verhalten, Persönlichkeit, Motivation und Denkmuster – erschafft psychologisch glaubwürdige Charaktere und Interaktionen auf Basis klinischer und wissenschaftlicher Modelle.", "x": ["Nutzer finden meinen Schurken flach: Er handelt nur aus Hass.", "Ich will eine NPC mit glaubwürdigen Traumata und emotionalen Reaktionen erschaffen.", "Prüfe, ob die Trauerreaktionen meiner Figuren falsch wirken.", "Introvertierter oder extrovertierter Protagonist fürs junge Publikum?"]}, "statistician": {"d": "Experte für quantitative Forschungsmethodik, Studiendesign und statistische Schlüsse – prüft Behauptungen, plant saubere Studien und trennt echtes Signal von Zufall und Verzerrung.", "x": ["Mein A/B-Test zeigt 60 % vs. 58 % – echter Unterschied oder Zufall?", "Ich brauche eine Zufriedenheitsumfrage ohne voreingenommene Fragen.", "Prüfe, ob meine Retentionsanalyse Ausreißer ignoriert.", "Mittelwert oder Median für die Sitzungsdauer berichten?"]}, "brand-guardian": {"d": "Erfahrener Markenstratege und -hüter, spezialisiert auf Markenaufbau, konsistentes Erscheinen und strategische Positionierung der Marke.", "x": ["Das Blau meines Logos ist ein anderes als das der Buttons, alles wirkt unstimmig.", "Ich brauche Palette, Tonalität und Logo für meine neue App.", "Prüfe, ob alle Screens die Markenidentität einhalten.", "Spaßiger oder seriöser Name für mein Produkt?"]}, "image-prompt-engineer": {"d": "Erfahrener Prompt-Ingenieur für Fotografie – formuliert detaillierte, stimmungsvolle Prompts für die KI-Bilderzeugung und übersetzt visuelle Ideen in präzise Sprache für professionelle Fotos.", "x": ["Meine KI-Bilder wirken amateurhaft, ich will Look wie ein Editorial-Foto.", "Ich brauche einen Prompt für ein Banner mit goldenem Abendlicht.", "Bewerte, ob mein Prompt das Produktfoto erzeugt, das ich beschrieben habe.", "Realistisches Porträt oder Illustration im Hero meiner Website?"]}, "inclusive-visuals-specialist": {"d": "Experte für faire Darstellung, der systematische KI-Voreingenommenheit überwindet und kulturell korrekte, wertschätzende Bilder und Videos ohne Stereotype erzeugt.", "x": ["Die KI-Bilder meiner App zeigen nur junge, weiße Menschen.", "Ich will Bilder, die mein vielfältiges Publikum ohne Stereotype zeigen.", "Prüfe meine generierten Bilder auf Verzerrung und Karikaturen.", "Stockfoto oder KI-generiertes inklusives Bild?"]}, "persona-walkthrough-specialist": {"d": "Simuliert Walkthroughs von Webseiten aus der Perspektive einer definierten Persona – hält Emotionen und Gedanken an jeder Scrollposition fest und liefert strukturierte CRO-Berichte nach LIFT, Cialdini und Fogg.", "x": ["Käufer springen auf der Preisseite ab – was empfinden sie beim Scrollen?", "Simuliere, wie ein gehetzter Kunde meinen Checkout durchläuft.", "Analysiere meine Startseite aus Sicht eines skeptischen Besuchers.", "Reihenfolge der Sektionen ändern oder nur die Texte der Seite?"]}, "ui-designer": {"d": "Erfahrener UI-Designer für Designsysteme, Komponentenbibliotheken und pixelgenaue Oberflächen – gestaltet schöne, konsistente, barrierefreie Interfaces, die UX stärken und die Marke widerspiegeln.", "x": ["Meine Buttons haben 6 Größen und 4 verschiedene Blautöne, es ist chaotisch.", "Ich brauche Farbsystem, Typografie und Komponenten für meine App.", "Prüfe die Screens und markiere Inkonsistenzen bei Abständen und Stil.", "Cards oder Listen für die Produktseite?"]}, "ui-finish-gate-reviewer": {"d": "Prüfer für Produktoberflächen, der generische, austauschbare UI vor dem Launch aufspürt – mit Kritik auf Basis echter Produktdaten, schriftlichem Designvertrag und harter Umsetzungs-Abnahme.", "x": ["Ich will meine App veröffentlichen, aber die Screens wirken wie generische Templates.", "Ich brauche eine Finish-Checkliste vor dem Launch.", "Zeig alles Unfertige oder Austauschbare auf meinen Screens.", "Jetzt mit Fallbacks launchen oder verzögern, um das Visuell zu polieren?"]}, "ux-architect": {"d": "Spezialist für technische Architektur und UX – gibt Entwicklern solide Grundlagen, CSS-Systeme und klare Umsetzungshinweise.", "x": ["Mein CSS ist eine Suppe aus Duplikaten, jeder Screen folgt anderem Muster.", "Ich brauche ein technisches Fundament: Design-Tokens und wiederverwendbare Komponenten.", "Prüfe meine Komponentenstruktur, bevor ich die App skaliere.", "Starte ich mit Tailwind oder einer fertigen Komponentenbibliothek?"]}, "ux-researcher": {"d": "Erfahrener UX-Forscher für Nutzerverhalten, Usability-Tests und datenbasierte Design-Erkenntnisse – liefert umsetzbare Ergebnisse, die Bedienbarkeit und Zufriedenheit verbessern.", "x": ["Ich glaube, niemand findet den Abo-Button – wie bestätige ich das?", "Ich muss einen Usability-Test mit 5 Laien aufsetzen.", "Analysiere die Session-Aufnahmen und sag, wo Nutzer hängen bleiben.", "Interviews oder A/B-Test, um die neue Navigation zu validieren?"]}, "visual-storyteller": {"d": "Experte für visuelle Kommunikation – erschafft überzeugende visuelle Erzählungen, Multimedia-Inhalte und Markengeschichten, die komplexe Infos verständlich machen und Emotionen wecken.", "x": ["Meine Über-uns-Seite ist eine Textwand, niemand liest sie.", "Ich muss meine Wirkungsdaten in Visuals für die Startseite verwandeln.", "Prüfe, ob die Bildfolge der Startseite eine Geschichte erzählt.", "Animiertes Video oder Bildkarussell auf der Landingpage?"]}, "whimsy-injector": {"d": "Kreativspezialist, der Markenerlebnissen Persönlichkeit, Freude und verspielte Elemente hinzufügt – unvergessliche, fröhliche Momente, die durch unerwarteten Charme auffallen.", "x": ["Meine App funktioniert, ist aber langweilig, niemand sagt etwas dazu.", "Ich will witzige Mikrointeraktionen beim Abschließen von Aufgaben.", "Prüfe, wo die App überraschen kann, ohne die Aufgabe zu stören.", "Konfetti beim Abschluss oder etwas dezenter?"]}, "ai-data-remediation-engineer": {"d": "Spezialist für selbstheilende Datenpipelines – erkennt und korrigiert Datenanomalien automatisch mit lokalen KI-Kleinmodellen, ohne Datenverlust und ohne Pipeline-Stop.", "x": ["Meine Pipeline stoppt jede Nacht wegen schmutziger Lieferantendaten.", "Ich muss falsche IDs und Daten in 2 Mio. Zeilen automatisch bereinigen.", "Prüfe meine Korrekturlogik für Daten, bevor sie in Produktion läuft.", "Korrigiere ich am Eingang mit Regeln oder verarbeite alles manuell neu?"]}, "ai-engineer": {"d": "Erfahrener KI/ML-Ingenieur für Entwicklung, Einsatz und Integration von ML-Modellen in Produktivsysteme – baut intelligente Features, Datenpipelines und KI-Apps mit Fokus auf praktische, skalierbare Lösungen.", "x": ["Ich will KI-Produktvorschläge im Warenkorb – wo fange ich an?", "Ich muss ein Klassifikationsmodell in meine Support-API integrieren.", "Prüfe Kosten und Latenz meiner Modellaufrufe in Produktion.", "Fertige OpenAI-API oder lokales Open-Source-Modell?"]}, "api-platform-engineer": {"d": "Erfahrener API-Plattform-Ingenieur für öffentliche und Partner-APIs – Contract-First-Design (OpenAPI/gRPC), Versionierung, SDK-Generierung, Gateway-Themen (Auth, Rate Limits, Quoten) und Entwicklerportal.", "x": ["Ich öffne meine API für Partner und weiß nicht, wie ich Versionierung und Limits mache.", "Ich brauche OpenAPI-Doku, ein Key-Portal und Rate Limiting.", "Prüfe den Vertrag meiner API, bevor ich sie Dritten öffne.", "Version in der URL (/v2) oder im Header?"]}, "ats-validator-architect": {"d": "Architekt und Prüfer für Bewerbungssysteme (ATS) und Lebenslauf-Parser – kombiniert regelbasierte Textsuche ohne KI, Heuristiken, Layout- und PDF-Prüfung, Normkonformität und schnelle Ausführung.", "x": ["Meine Lebenslauf-Seite lehnt PDFs ab, die Nutzer für fehlerfrei halten.", "Ich muss Lebensläufe per Schlagwörtern bewerten, ohne bezahlte KI.", "Prüfe, ob mein Parser zweispaltige Lebensläufe mit Foto verarbeitet.", "Analysiere ich mit KI oder mit deterministischen Regeln?"]}, "autonomous-optimization-architect": {"d": "Intelligenter Systemwächter, der APIs laufend verdeckt auf Performance testet und dabei strenge Kosten- und Sicherheitsgrenzen gegen explodierende Ausgaben durchsetzt.", "x": ["Meine Cloud-Rechnung hat sich verdoppelt, 24h-KI-Tests machen mir Angst.", "Ich brauche Kostenlimits, während ich die API-Performance teste.", "Prüfe, ob mein Lasttest unkontrolliert Verluste verursachen kann.", "Pipeline wegen Kosten stoppen oder mit Schutzschranken laufen lassen?"]}, "backend-architect": {"d": "Senior-Backend-Architekt für skalierbares Systemdesign, Datenbankarchitektur, API-Entwicklung und Cloud-Infrastruktur – baut robuste, sichere und performante Serveranwendungen und Microservices.", "x": ["Meine App stockt bei 200 Nutzern, das Backend ist eine einzige Datei.", "Ich muss API, Datenbank und Queues für eine Terminplaner-App entwerfen.", "Prüfe die Backend-Architektur, bevor ich Zahlungen ergänze.", "Einfacher Monolith oder Microservices von Anfang an?"]}, "china-network-engineer": {"d": "Experte für die gängigen Enterprise-Netzwerk-Stacks Chinas – Huawei VRP, H3C Comware, Ruijie RGOS und Hillstone StoneOS – inklusive Routing, Switching, Firewalls, NAT und MLPS-2.0-konformem Grenzaufbau.", "x": ["Mein Server in China erreicht die gebuchten Huawei-Dienste nicht.", "Ich muss Huawei-Firewalls und NAT für die Filiale in Shenzhen einrichten.", "Prüfe, ob mein Netzrand den lokalen MLPS-2.0-Standard erfüllt.", "Huawei- oder H3C-Ausrüstung in der chinesischen Filiale?"]}, "cms-developer": {"d": "Drupal- und WordPress-Spezialist für Theme-Entwicklung, eigene Plugins/Module, Inhaltsarchitektur und codebasierte CMS-Umsetzung.", "x": ["Kunden sollen Websitetexte bearbeiten können, ohne Code anzufassen.", "Ich will in WordPress einen Inhaltstyp „Events“ mit Datum und Bild.", "Prüfe mein WordPress-Theme vor dem Launch, es hat doppelten Code.", "WordPress oder Drupal für das Institutsportal?"]}, "code-reviewer": {"d": "Erfahrener Code-Reviewer mit konstruktivem, umsetzbarem Feedback zu Korrektheit, Wartbarkeit, Sicherheit und Performance – nicht zu Stilfragen.", "x": ["Meine App läuft, aber der Code hat Funktionen mit 500 Zeilen.", "Ich muss KI-generierten Code prüfen, bevor er in Produktion geht.", "Zeige Bugs und Sicherheitsrisiken in meinem Login-Modul.", "Jetzt refaktorieren oder mit dem nächsten Feature zusammen?"]}, "codebase-onboarding-engineer": {"d": "Spezialist für Entwickler-Einarbeitung – hilft Neuen, fremde Codebasen schnell zu verstehen, indem er Quellcode liest, Pfade nachverfolgt und nur belegbare Fakten nennt.", "x": ["Ich habe ein Fertigprojekt gekauft und weiß nicht, wo die Logik beginnt.", "Ich brauche eine Codekarte: Wer ruft was auf, wo liegen die Routen?", "Bestätige, ob diese verwaiste Funktion genutzt wird, bevor ich lösche.", "Code von null selbst studieren oder einem geführten Pfad folgen?"]}, "data-engineer": {"d": "Erfahrener Data Engineer für zuverlässige Datenpipelines, Lakehouse-Architekturen und skalierbare Dateninfrastruktur – beherrscht ETL/ELT, Apache Spark, dbt, Streaming und Cloud-Dat const VER = DATA.version;
const LANGS = DATA.langs;
const LS_LANG = "agencia-guia:lang";
const LS_KEY = "agencia-guia:lastUpdCheck";

let STATUS = null;
try { STATUS = window.GUIA_STATUS || null; } catch(e) { STATUS = null; }
function detectOS(){
  const ua = navigator.userAgent;
  if (/Windows NT/.test(ua)) return "windows";
  if (/Mac OS X/.test(ua)) return "macos";
  if (/Linux/.test(ua) && !/Android/.test(ua)) return "linux";
  if (/Android/.test(ua)) return "android";
  return "unknown";
}
function normLang(l){
  if (!l) return null;
  l = String(l).toLowerCase();
  if (l.startsWith("pt")) return "pt";
  if (l.startsWith("es")) return "es";
  if (l.startsWith("fr")) return "fr";
  if (l.startsWith("de")) return "de";
  if (l.startsWith("en")) return "en";
  return null;
}
let LANG = null;
try { LANG = normLang(localStorage.getItem(LS_LANG)); } catch(e) {}
if (!LANG && STATUS && STATUS.lang) LANG = normLang(STATUS.lang);
if (!LANG) LANG = normLang(navigator.language) || "en";
if (!LANGS.includes(LANG)) LANG = "en";

function T(key){ return (UI[LANG] && UI[LANG][key]) || UI.en[key] || key; }
function tpl(key, vars){
  let s = T(key);
  for (const k in vars) s = s.split("{"+k+"}").join(vars[k]);
  return s;
}
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function escAttr(s){ return esc(s); }

function compatKey(os){
  return os.startsWith("linux") ? "l" : os === "macos" ? "m" : "w";
}
function osName(os){ return T("os"+os.charAt(0).toUpperCase()+os.slice(1)); }
const OS = (STATUS && STATUS.os && STATUS.os.family) || detectOS();
function toolCompat(t){
  if (!STATUS) return "unknown";
  const c = (t.compat && t.compat[compatKey(OS)]) || "nao";
  if (c === "nao") return "incompat";
  if (t.projectOnly) return "project";
  return "ok";
}

  const mStatus = document.getElementById("mStatus");
  if (STATUS){
    mStatus.innerHTML = tpl("mOs", {os: esc(osName(OS))}) +
      (STATUS.catalog ? tpl("mCat", {path: esc(STATUS.catalog.path), date: esc(STATUS.catalog.updated)}) : "") +
      tpl("mCheck", {when: esc(new Date(STATUS.generatedAt).toLocaleDateString(LANG))});
  } else {
    mStatus.innerHTML = tpl("machineNo", {os: esc(osName(OS))});
  }
  const grid = document.getElementById("toolGrid");
  grid.innerHTML = DATA.tools.filter(t=>t.main).map(t=>{
    const inst = STATUS ? STATUS.tools.find(x=>x.id===t.id) : null;
    const compat = toolCompat(t);
    let st, cls;
    if (!STATUS){ st = T("stUnknown"); cls = "st-unknown"; }
    else if (compat === "incompat"){ st = tpl("stIncompat", {os: esc(osName(OS))}); cls = "st-incompat"; }
    else if (compat === "project"){ st = T("stDetected"); cls = "st-detected"; }
    else if (!inst || !inst.installed){ st = T("stAbsent"); cls = "st-absent"; }
    else if (inst.agentCount > 0){ st = tpl("stReady", {n: inst.agentCount}); cls = "st-ready"; }
    else { st = T("stDetected"); cls = "st-detected"; }
    const hint = compat === "wsl" ? `<div class="t-dest">${esc(T("wslNote"))}</div>` :
                 compat === "project" ? `<div class="t-dest">${esc(t.dest)}</div>` :
                 `<div class="t-dest">${esc(t.dest)}</div>`;
    const desc = (t.descs && t.descs[LANG]) || t.descs.en;
    return `<div class="tool" data-id="${escAttr(t.id)}">
      <div class="t-head">${esc(t.icon)} ${esc(t.label)}</div>
      <span class="t-state ${cls}">${st}</span>
      <div class="t-desc">${esc(desc)}</div>${hint}
      <button data-tool="${escAttr(t.id)}">${esc(T("btnInstall").replace("➕ ","").replace("+ ",""))}</button>
    </div>`;
  }).join("");
}
function renderSeps(){
  const teamCards = document.querySelectorAll("#teamGrid .card");
  const anyTeam = [...teamCards].some(c=>!c.hidden);
  const ts = document.getElementById("teamSep");
  ts.innerHTML = `${T("teamSep")} <small>${esc(T("teamSepSub"))}</small>`;
  ts.hidden = !anyTeam;
  document.getElementById("catSep").innerHTML = `${T("catSep")} <small>${esc(T("catSepSub"))}</small>`;
}
function cardHTML(a, hot){
  const it = DATA.i18n[LANG].agents[a.slug];
  const divLabel = DATA.divLabels[LANG][a.division];
  const when = (a.custom_when && DATA.i18n[LANG].when.custom[a.slug]) || DATA.i18n[LANG].when.div[a.division];
  const tags = [`<span class="tag div">${esc(divLabel)}</span>`];
  if (a.inst_claude) tags.push(`<span class="tag claude">● Claude Code</span>`);
  if (a.inst_zcode) tags.push(`<span class="tag zcode">● ZCode</span>`);
  const orig = (LANG === "en") ? "" :
    `<details><summary>${esc(T("origEn"))}</summary><div>${esc(a.desc_en)}</div><pre>${esc(a.file)}</pre></details>`;
  return `<div class="card">
    <h3>${esc(a.name)}<small>${esc(a.slug)}</small></h3>
    <div class="tags">${tags.join("")}</div>
    <div class="desc">${esc(it.d)}</div>
    <div class="when ${hot?"hot":""}">${T("whenLabel")} ${esc(when)}</div>
    <details open="${hot?"open":""}"><summary>${esc(T("situations"))}</summary>
      <ul class="exList">${it.x.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>
    </details>
    ${orig}
  </div>`;
}
function renderCards(){
  const inst = DATA.agents.filter(a=>a.inst_claude||a.inst_zcode);
  const rest = DATA.agents.filter(a=>!(a.inst_claude||a.inst_zcode));
  document.getElementById("teamGrid").innerHTML = inst.map(a=>cardHTML(a,true)).join("");
  document.getElementById("grid").innerHTML = rest.map(a=>cardHTML(a,false)).join("");
  const chips = document.getElementById("chips");
  chips.innerHTML = `<button class="chip on" data-div="">${esc(DATA.divLabelAll)} <small>(${DATA.agents.length})</small></button>` +
    DATA.divisions.map(d=>`<button class="chip" data-div="${escAttr(d.raw)}">${esc(DATA.divLabels[LANG][d.raw])} <small>(${d.n}${d.inst?` · ⭐${d.inst}`:""})</small></button>`).join("");
}
function renderStats(){
  const stTools = STATUS ? STATUS.tools.filter(t=>t.installed && t.agentCount>0).length : 0;
  const stInst = STATUS ? STATUS.tools.reduce((s,t)=>s+t.agentCount,0) : DATA.agents.filter(a=>a.inst_claude||a.inst_zcode).length;
  document.getElementById("stTotal").textContent = DATA.agents.length;
  document.getElementById("stInst").textContent = stInst;
  document.getElementById("stTools").textContent = stTools;
  document.getElementById("stDiv").textContent = DATA.divisions.length;
}
function renderAll(){
  renderChrome(); renderMachine(); renderCards(); renderStats(); renderSeps(); apply();
}

/* ---------- busca/filtros ---------- */
const q = document.getElementById("q"), onlyInst = document.getElementById("onlyInst");
const countEl = document.getElementById("count"), emptyEl = document.getElementById("empty");
let activeDiv = null;
function norm(s){ return String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,""); }
function apply(){
  const term = norm(q.value.trim());
  let shown = 0;
  for (const el of document.querySelectorAll(".card")){
    const slug = el.querySelector("h3 small").textContent;
    const a = DATA.bySlug[slug];
    const it = DATA.i18n[LANG].agents[slug];
    const hay = norm([a.name, slug, it.d, a.desc_en, it.x.join(" ")].join(" "));
    const ok = (!activeDiv || a.division === activeDiv)
      && (!onlyInst.checked || a.inst_claude || a.inst_zcode)
      && (!term || hay.includes(term));
    el.hidden = !ok; if (ok) shown++;
  }
  countEl.textContent = tpl("showingTpl", {a: shown, b: DATA.agents.length});
  emptyEl.hidden = shown > 0;
  renderSeps();
}

/* ---------- wizard ---------- */
const wiz = document.getElementById("wiz");
let wizSel = {tools:new Set(), squad:null, slugs:[]};
function renderWizardTools(){
  document.getElementById("w1t").textContent = T("w1t");
  document.getElementById("w1sub").textContent = T("w1sub");
  document.getElementById("w2t").textContent = T("w2t");
  document.getElementById("w2sub").textContent = T("w2sub");
  document.getElementById("w3t").textContent = T("w3t");
  document.getElementById("wStep1").textContent = T("wStep1");
  document.getElementById("wDownload").textContent = T("wDownload");
  document.getElementById("wStep2").textContent = T("wStep2");
  document.getElementById("wNote").textContent = T("wNote");
  document.getElementById("wBack2").textContent = T("btnBack");
  document.getElementById("wBack3").textContent = T("btnBack");
  document.getElementById("wNext1").textContent = T("btnNext");
  document.getElementById("wNext2").textContent = T("btnNext");
  document.getElementById("wClose").textContent = T("btnClose");
  const wizTools = document.getElementById("wizTools");
  wizTools.innerHTML = DATA.tools.filter(t=>{
    const c = toolCompat(t);
    return c === "ok" || c === "project" || c === "wsl" || c === "unknown";
  }).map(t=>{
    const c = toolCompat(t);
    const lbl = c === "project" ? " ("+T("stDetected").replace(/[^\w\sáéíóúà-ÿ():·-]/g,"").trim()+")" : c === "wsl" ? " ("+T("wslNote")+")" : "";
    return `<label class="opt"><input type="checkbox" value="${escAttr(t.id)}" ${wizSel.tools.has(t.id)?"checked":""}>
      <span><span class="o-t">${esc(t.icon)} ${esc(t.label)}${esc(lbl)}</span><br><span class="o-d">${esc((t.descs&&t.descs[LANG])||t.descs.en)}</span></span></label>`;
  }).join("");
  wizTools.querySelectorAll("input").forEach(i=>i.addEventListener("change",()=>{
    i.checked ? wizSel.tools.add(i.value) : wizSel.tools.delete(i.value);
  }));
  const wizSquads = document.getElementById("wizSquads");
  const nAll = DATA.agents.length;
  wizSquads.innerHTML = `
    <label class="opt"><input type="radio" name="sq" value="pre-lancamento" checked><span><span class="o-t">${esc(T("sqPre"))}</span><br><span class="o-d">${esc(T("sqPreD"))}</span></span></label>
    <label class="opt"><input type="radio" name="sq" value="treino"><span><span class="o-t">${esc(T("sqTrain"))}</span><br><span class="o-d">${esc(T("sqTrainD"))}</span></span></label>
    <label class="opt"><input type="radio" name="sq" value="todas"><span><span class="o-t">${esc(tpl("sqAll",{n:nAll}))}</span><br><span class="o-d">${esc(T("sqAllD"))}</span></span></label>
    <label class="opt"><input type="radio" name="sq" value="divisao"><span><span class="o-t">${esc(T("sqDiv"))}</span><br><span class="o-d">${esc(T("sqDivD"))}</span></span></label>`;
  let divBox = document.getElementById("wizDivs");
  if (divBox) divBox.remove();
  divBox = document.createElement("div");
  divBox.id = "wizDivs"; divBox.style.display = "none";
  divBox.innerHTML = DATA.divisions.map(d=>`<label class="opt"><input type="checkbox" value="${escAttr(d.raw)}"><span><span class="o-t">${esc(DATA.divLabels[LANG][d.raw])}</span> <span class="o-d">(${d.n})</span></span></label>`).join("");
  wizSquads.parentNode.insertBefore(divBox, wizSquads.nextSibling);
  wizSquads.querySelectorAll("input[name=sq]").forEach(i=>i.addEventListener("change",()=>{
    divBox.style.display = i.value === "divisao" ? "block" : "none";
  }));
}
function showStep(n){
  wiz.querySelectorAll(".mStep").forEach(s=>s.classList.toggle("on", s.dataset.step == String(n)));
}
function openWizard(forTool){
  wizSel = {tools:new Set(), squad:null, slugs:[]};
  if (forTool) wizSel.tools.add(forTool);
  renderWizardTools();
  showStep(1);
  wiz.showModal();
}
document.getElementById("btnWizard").addEventListener("click", ()=>openWizard(null));
document.getElementById("toolGrid").addEventListener("click", e=>{
  const b = e.target.closest("button[data-tool]");
  if (b) openWizard(b.dataset.tool);
});
document.getElementById("wNext1").addEventListener("click", ()=>{
  if (!wizSel.tools.size){ alert(T("errNeedTool")); return; }
  showStep(2);
});
document.getElementById("wBack2").addEventListener("click", ()=>showStep(1));
document.getElementById("wNext2").addEventListener("click", ()=>{
  const sq = document.querySelector('#wizSquads input[name="sq"]:checked').value;
  let slugs = [];
  if (sq === "pre-lancamento" || sq === "treino") slugs = DATA.squads[sq].slugs.slice();
  else if (sq === "todas") slugs = DATA.agents.map(a=>a.slug);
  else {
    const sel = [...document.querySelectorAll("#wizDivs input:checked")].map(i=>i.value);
    if (!sel.length){ alert(T("errNeedDiv")); return; }
    slugs = DATA.agents.filter(a=>sel.includes(a.division)).map(a=>a.slug);
  }
  wizSel.squad = sq; wizSel.slugs = slugs;
  const toolsLbl = [...wizSel.tools].map(id=>(DATA.tools.find(t=>t.id===id)||{}).label).join(" + ");
  document.getElementById("w3sub").innerHTML = tpl("w3sub", {n: slugs.length, tools: esc(toolsLbl)});
  const cmd = OS === "windows"
    ? "powershell -File ..\\instaladores\\instalar-windows.ps1 -Plan agency-plan.json"
    : OS === "macos"
      ? "bash ../instaladores/instalar-linux.sh --plan agency-plan.json"
      : "../instaladores/instalar-linux.sh --plan agency-plan.json";
  document.getElementById("wCmd").textContent = cmd;
  showStep(3);
});
document.getElementById("wBack3").addEventListener("click", ()=>showStep(2));
document.getElementById("wClose").addEventListener("click", ()=>wiz.close());
document.getElementById("wDownload").addEventListener("click", ()=>{
  const plano = {plano: "agency-guia", versao: 2, geradoEm: new Date().toISOString(), sistema: OS,
                 idioma: LANG, ferramentas: [...wizSel.tools], squad: wizSel.squad,
                 agentes: wizSel.slugs.map(s=>{const a = DATA.bySlug[s]; return {slug: s, file: a.file};})};
  const blob = new Blob([JSON.stringify(plano, null, 1)], {type: "application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = "agency-plan.json"; a.click();
  URL.revokeObjectURL(a.href);
});

/* ---------- idioma ---------- */
document.getElementById("langbar").addEventListener("click", e=>{
  const b = e.target.closest(".langbtn");
  if (!b) return;
  LANG = b.dataset.lang;
  try { localStorage.setItem(LS_LANG, LANG); } catch(err) {}
  renderAll();
});

/* ---------- atualizações ---------- */
async function gh(url){
  const r = await fetch(url, {headers:{Accept:"application/vnd.github+json"}});
  if (!r.ok) throw new Error(r.status);
  return r.json();
}
async function checkUpdates(force){
  let last = 0;
  try { last = +localStorage.getItem(LS_KEY) || 0; } catch(e) {}
  if (!force && Date.now() - last < 24*3600*1000) return;
  try { localStorage.setItem(LS_KEY, String(Date.now())); } catch(e) {}
  const found = [];
  try {
    const rel = await gh("https://api.github.com/repos/msitarzewski/agency-agents-app/releases/latest");
    found.push("Agency Agents App " + rel.tag_name + " → github.com/msitarzewski/agency-agents-app/releases");
  } catch(e){}
  try {
    const rel = await gh("https://api.github.com/repos/" + DATA.ourRepo + "/releases/latest");
    if (rel.tag_name && rel.tag_name !== "v" + VER) found.push("Guide " + rel.tag_name + " (you have v" + VER + ")");
  } catch(e){}
  const badge = document.getElementById("updBadge");
  if (found.length){
    badge.textContent = T("updBadge");
    badge.hidden = false; badge.title = found.join("\n");
    badge.onclick = ()=>alert(found.join("\n\n"));
  } else badge.hidden = true;
}
document.getElementById("btnRecheck").addEventListener("click", ()=>checkUpdates(true));
checkUpdates(false);

/* ---------- boot ---------- */
document.getElementById("chips").addEventListener("click", e=>{
  const b = e.target.closest(".chip"); if (!b) return;
  activeDiv = b.dataset.div || null;
  document.querySelectorAll("#chips .chip").forEach(c=>c.classList.toggle("on", c===b));
  apply();
});
q.addEventListener("input", apply);
onlyInst.addEventListener("change", apply);
document.addEventListener("keydown", e=>{ if (e.key === "/" && document.activeElement !== q){ e.preventDefault(); q.focus(); } });
DATA.bySlug = Object.fromEntries(DATA.agents.map(a=>[a.slug, a]));
renderAll();
apply();
</script>
